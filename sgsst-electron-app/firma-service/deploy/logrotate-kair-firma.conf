# =============================================================================
# K+AIR Firma Electronica - rotacion y retencion de logs (logrotate)
# =============================================================================
# Que resuelve esto:
#   El 12-nov-2026 se midio en produccion que NO habia ninguna configuracion
#   de rotacion para `kair-firma`: `ls /etc/logrotate.d/ | grep -i kair` no
#   devolvia nada. El monitor de salud escribe en
#   `/opt/kair-firma/logs/health-check.log` y ese archivo CRECIA sin rotar
#   (409 619 B al 12-nov 13:35): nadie lo limpiaba y nadie lo comprimia.
#
#   Con esto quedan las tres casillas de SECURITY.md Seccion7.4 que NO se cumplian:
#     - "Rotacion de logs configurada"   -> este archivo.
#     - "Retencion 90 dias"               -> `rotate 90` + `maxage 90`.
#     - "Acceso al log restringido"        -> el permiso del DIRECTORIO, que
#       se cambia aparte (ver Seccion3 del README de este archivo): este logrotate
#       NO puede cambiar los permisos de un directorio.
#
# INSTALAR (lo hace el owner, con sudo):
#   sudo cp logrotate-kair-firma.conf /etc/logrotate.d/kair-firma
#   sudo chown root:root /etc/logrotate.d/kair-firma
#   sudo chmod 644 /etc/logrotate.d/kair-firma
#   sudo logrotate -d /etc/logrotate.d/kair-firma     # prueba, no rota
#   sudo systemctl reload logrotate 2>/dev/null || sudo systemctl restart logrotate
#
# POR QUE `copytruncate`
# ----------------------
# El servicio y el cron de salud escriben en el MISMO archivo, con el
# descriptor abierto: el proceso no rotara solo. Sin `copytruncate`,
# logrotate RENOMBRA el archivo y el servicio seguiria escribiendo en el
# inode viejo (un archivo que nadie mira): el espacio no se libera y el log
# "desaparece". Con `copytruncate`, logrotate copia el contenido a un
# archivo fechado y TRUNCA el original: quien escribe sigue escribiendo en
# el mismo archivo y la rotacion es real.
#
# POR QUE `su root root`
# ----------------------
# Los logs son de root (los escribe el cron que corre como root) y tienen
# que quedar de root. `su root root` lo garantiza aunque logrotate lo
# invoque alguien que no es root.
#
# NOTA SOBRE `create`
# -------------------
# Con `copytruncate` el archivo original NO se recrea: se trunca. Por eso
# aqui NO se pone `create` (logrotate lo ignora cuando hay `copytruncate`,
# y ponerlo confunde la lectura). Los permisos del archivo vivo se fijan
# aparte, en el `postrotate` de abajo y en el README: 640 root:root.
#
# Este archivo es configuracion: se escribe en ASCII puro (sin tildes ni
# enie) y con finales de linea LF.
# =============================================================================

# El directorio de logs del servicio: ahi escribe el monitor de salud.
# `su root root` y `copytruncate` requieren que el directorio exista.
/opt/kair-firma/logs/*.log {
    daily
    rotate 90
    maxage 90
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
    postrotate
        # El archivo vivo (el que truncatea) y los rotados quedan de root y
        # solo legibles por root y por el grupo del servicio.
        /bin/chown root:root /opt/kair-firma/logs/*.log 2>/dev/null || true
        /bin/chmod 0640 /opt/kair-firma/logs/*.log 2>/dev/null || true
    endscript
}

# Los logs de los respaldos (backup.log, purga.log, restauracion.log,
# offsite.log) crecen con la misma razon y nunca se limpiaban. Misma
# retencion de 90 dias.
# (En Ubuntu el `postrotate` de un bloque NO se hereda al siguiente: por eso
# se repite aqui.)
/opt/kair-firma/backups/*.log {
    daily
    rotate 90
    maxage 90
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
    postrotate
        /bin/chown root:root /opt/kair-firma/backups/*.log 2>/dev/null || true
        /bin/chmod 0640 /opt/kair-firma/backups/*.log 2>/dev/null || true
    endscript
}
