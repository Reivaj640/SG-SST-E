<!-- ═══════════════════════════════════════════════════════════════════
     K+AIR · 3.1.6 Restricciones y Recomendaciones Médicas · Portal premium v2
     📦775 — Migrado al dialecto premium (tokens --kair-*) y, sobre todo,
     SCOPED bajo .rm-portal-scope. El portal se inyecta con innerHTML en el
     DOCUMENTO PRINCIPAL (render() en restricciones-medicas-logic.js), así que
     su <style> filtraba `:root` y `*` a TODA la app (misma fuga del 📦766).
     · Todo selector bajo .rm-portal-scope.
     · Iconos en SVG inline (se quitaron los CDN de Font Awesome/Bootstrap).
     · Fragmento (sin html/head/body): el <script> del home lo carga render().
     ═══════════════════════════════════════════════════════════════════ -->
<style>
    .rm-portal-scope {
        --rmp-bg: var(--kair-canvas, #fbfcfb);
        --rmp-card: var(--kair-card, #ffffff);
        --rmp-line: var(--kair-line, #e8ebee);
        --rmp-ink: var(--kair-ink, #14213d);
        --rmp-muted: var(--kair-muted, #748096);
        --rmp-faint: var(--kair-faint, #aab1bd);
        --rmp-blue: var(--kair-blue, #2057b8);
        --rmp-blue-soft: var(--kair-blue-soft, #eaf1fb);
        --rmp-green: var(--kair-mint, #1bb888);
        --rmp-green-soft: var(--kair-green-soft, #e6f5ef);
        --rmp-amber: var(--kair-amber, #e7a224);
        --rmp-amber-soft: var(--kair-amber-soft, #fbf0db);
        --rmp-violet: #7c4dbe;
        --rmp-violet-soft: #f1eafb;
        --rmp-shadow: 0 1px 2px rgba(37, 56, 82, .05), 0 8px 24px rgba(37, 56, 82, .07);
        --rmp-font: var(--kair-font-ui, 'DM Sans', system-ui, -apple-system, sans-serif);
        --rmp-font-display: var(--kair-font-display, 'Manrope', 'DM Sans', sans-serif);

        box-sizing: border-box;
        min-height: 100%;
        padding: 22px clamp(16px, 2vw, 32px) 34px;
        background: var(--rmp-bg);
        color: var(--rmp-ink);
        font-family: var(--rmp-font);
        font-size: 14px;
    }
    .rm-portal-scope *,
    .rm-portal-scope *::before,
    .rm-portal-scope *::after { box-sizing: border-box; }

    [data-theme="dark"] .rm-portal-scope,
    [data-theme="dark-legacy"] .rm-portal-scope {
        --rmp-bg: #0f172a;
        --rmp-card: #1a2334;
        --rmp-line: #2f3d55;
        --rmp-ink: #e8edf5;
        --rmp-muted: #a9b4c6;
        --rmp-faint: #748096;
        --rmp-blue: #6ea8fe;
        --rmp-blue-soft: rgba(110, 168, 254, .16);
        --rmp-green: #3ecf9a;
        --rmp-green-soft: rgba(62, 207, 154, .16);
        --rmp-amber: #f0b45a;
        --rmp-amber-soft: rgba(240, 180, 90, .16);
        --rmp-violet: #a98bf0;
        --rmp-violet-soft: rgba(169, 139, 240, .16);
        --rmp-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }

    .rm-portal-scope .rm-portal { max-width: 1120px; margin: 0 auto; }

    /* ── Breadcrumb ── */
    .rm-portal-scope .rm-breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12.5px;
        color: var(--rmp-faint);
        margin-bottom: 14px;
    }
    .rm-portal-scope .rm-breadcrumb strong { color: var(--rmp-ink); font-weight: 700; }
    .rm-portal-scope .rm-breadcrumb .rm-sep { opacity: .7; }

    /* ── Header ── */
    .rm-portal-scope .rm-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }
    .rm-portal-scope .rm-head-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .rm-portal-scope .rm-head-icon {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: var(--rmp-blue-soft);
        color: var(--rmp-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .rm-portal-scope .rm-head-icon svg { width: 23px; height: 23px; }
    .rm-portal-scope .rm-title {
        font-family: var(--rmp-font-display);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -.01em;
        line-height: 1.2;
        margin: 0;
    }
    .rm-portal-scope .rm-sub { font-size: 13px; color: var(--rmp-muted); margin: 3px 0 0; }

    .rm-portal-scope .rm-back {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 15px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--rmp-blue);
        background: var(--rmp-card);
        border: 1px solid var(--rmp-line);
        border-radius: 11px;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease;
    }
    .rm-portal-scope .rm-back svg { width: 15px; height: 15px; }
    .rm-portal-scope .rm-back:hover { background: var(--rmp-blue-soft); border-color: var(--rmp-blue); }

    /* ── Acciones principales (2 tarjetas) ── */
    .rm-portal-scope .rm-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 30px;
    }
    .rm-portal-scope .rm-action {
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        padding: 22px;
        font-family: inherit;
        color: var(--rmp-ink);
        background: var(--rmp-card);
        border: 1px solid var(--rmp-line);
        border-radius: 18px;
        box-shadow: var(--rmp-shadow);
        cursor: pointer;
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .rm-portal-scope .rm-action:hover { transform: translateY(-2px); border-color: var(--rmp-blue); }
    .rm-portal-scope .rm-action-icon {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: var(--rmp-blue-soft);
        color: var(--rmp-blue);
    }
    .rm-portal-scope .rm-action-icon svg { width: 24px; height: 24px; }
    .rm-portal-scope .rm-action--primary {
        background: linear-gradient(135deg, var(--rmp-blue) 0%, #172c4c 100%);
        border-color: transparent;
        color: #fff;
    }
    .rm-portal-scope .rm-action--primary .rm-action-icon { background: rgba(255, 255, 255, .18); color: #fff; }
    .rm-portal-scope .rm-action--primary .rm-action-title { color: #fff; }
    .rm-portal-scope .rm-action--primary .rm-action-desc { color: rgba(255, 255, 255, .85); }
    .rm-portal-scope .rm-action--primary:hover { border-color: transparent; }
    .rm-portal-scope .rm-action--send .rm-action-icon { background: var(--rmp-green-soft); color: var(--rmp-green); }
    .rm-portal-scope .rm-action-title { display: block; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .rm-portal-scope .rm-action-desc { display: block; font-size: 12.5px; color: var(--rmp-muted); line-height: 1.45; }

    /* ── Herramientas ── */
    .rm-portal-scope .rm-quick-title {
        font-family: var(--rmp-font-display);
        font-size: 15px;
        font-weight: 700;
        margin: 0 0 14px;
    }
    .rm-portal-scope .rm-quick-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
    }
    .rm-portal-scope .rm-quick-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        gap: 10px;
        padding: 18px;
        font-family: inherit;
        color: var(--rmp-ink);
        background: var(--rmp-card);
        border: 1px solid var(--rmp-line);
        border-radius: 16px;
        cursor: pointer;
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .rm-portal-scope .rm-quick-card:hover { transform: translateY(-2px); border-color: var(--rmp-blue); box-shadow: var(--rmp-shadow); }
    .rm-portal-scope .rm-quick-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--rmp-blue-soft);
        color: var(--rmp-blue);
    }
    .rm-portal-scope .rm-quick-icon svg { width: 20px; height: 20px; }
    .rm-portal-scope .rm-quick-icon--green { background: var(--rmp-green-soft); color: var(--rmp-green); }
    .rm-portal-scope .rm-quick-icon--amber { background: var(--rmp-amber-soft); color: var(--rmp-amber); }
    .rm-portal-scope .rm-quick-icon--violet { background: var(--rmp-violet-soft); color: var(--rmp-violet); }
    .rm-portal-scope .rm-quick-name { display: block; font-weight: 700; font-size: 13.5px; }
    .rm-portal-scope .rm-quick-desc { display: block; font-size: 12px; color: var(--rmp-muted); line-height: 1.45; }

    @media (max-width: 720px) {
        .rm-portal-scope .rm-actions { grid-template-columns: 1fr; }
        .rm-portal-scope .rm-title { font-size: 19px; }
    }
</style>
