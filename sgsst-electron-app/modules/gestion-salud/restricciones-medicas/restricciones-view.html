<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remisiones Médicas — K+AIR</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="restricciones-view.css">
</head>
<body>

<div class="rm-wrapper">

    <!-- ═══ HEADER ═══ -->
    <header class="rm-header">
        <div class="rm-header-left">
            <button class="rm-btn-icon" id="backBtn" title="Volver a la antesala">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <h1 class="rm-title">Remisiones y Recomendaciones Médicas</h1>
                <p class="rm-subtitle">Consulta y gestiona documentos de remisiones médicas ocupacionales</p>
            </div>
        </div>
        <div class="rm-header-right">
            <button class="rm-btn-icon" id="refreshBtn" title="Actualizar">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <!-- ═══ BODY ═══ -->
    <main class="rm-body">
        <div class="rm-container">

            <!-- Stats -->
            <div class="rm-stats-row" id="statsRow">
                <div class="rm-stat-card">
                    <div class="rm-stat-icon" style="background:#e8f0fe;color:#174ea6;"><i class="fas fa-file-medical"></i></div>
                    <div class="rm-stat-value" id="statTotal">—</div>
                    <div class="rm-stat-label">Total Documentos</div>
                </div>
                <div class="rm-stat-card">
                    <div class="rm-stat-icon" style="background:#e8f5e9;color:#28a745;"><i class="fas fa-folder"></i></div>
                    <div class="rm-stat-value" id="statFolders">—</div>
                    <div class="rm-stat-label">Carpetas</div>
                </div>
                <div class="rm-stat-card">
                    <div class="rm-stat-icon" style="background:#fff3e0;color:#ffc107;"><i class="fas fa-clock"></i></div>
                    <div class="rm-stat-value" id="statRecent">—</div>
                    <div class="rm-stat-label">Este Año</div>
                </div>
            </div>

            <!-- Search + Filters -->
            <div class="rm-controls-row">
                <div class="rm-search-bar">
                    <i class="fas fa-search rm-search-icon"></i>
                    <input type="text" id="searchInput" class="rm-search-input" placeholder="Buscar documentos por nombre…">
                    <button class="rm-search-clear" id="searchClear" title="Limpiar búsqueda">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="rm-filters" id="filterGroup">
                    <button class="rm-filter-btn active" data-filter="all">
                        <i class="fas fa-layer-group"></i> Todos
                    </button>
                    <button class="rm-filter-btn" data-filter="pdf">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="rm-filter-btn" data-filter="doc">
                        <i class="fas fa-file-word"></i> Word
                    </button>
                    <button class="rm-filter-btn" data-filter="xls">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                </div>
            </div>

            <!-- Loading spinner -->
            <div class="rm-loading" id="loadingSpinner">
                <div class="rm-spinner"></div>
                <p>Cargando documentos…</p>
            </div>

            <!-- Year-grouped list -->
            <div class="rm-year-list" id="yearList"></div>

            <!-- Empty state -->
            <div class="rm-empty" id="emptyState" style="display:none;">
                <i class="fas fa-inbox"></i>
                <h3>No se encontraron documentos</h3>
                <p>No hay remisiones médicas en esta empresa aún.</p>
            </div>

        </div>
    </main>

    <!-- ═══ PREVIEW MODAL ═══ -->
    <div class="rm-modal" id="previewModal" style="display:none;">
        <div class="rm-modal-overlay" id="previewOverlay"></div>
        <div class="rm-modal-content">
            <div class="rm-modal-header">
                <div class="rm-modal-title-wrap">
                    <i class="fas fa-file-medical rm-modal-icon"></i>
                    <h3 class="rm-modal-title" id="modalTitle">Vista previa</h3>
                </div>
                <div class="rm-modal-actions">
                    <button class="rm-btn-sm" id="modalDownloadBtn" title="Descargar">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="rm-btn-sm" id="modalOpenExtBtn" title="Abrir con app externa">
                        <i class="fas fa-external-link-alt"></i>
                    </button>
                    <button class="rm-btn-sm rm-btn-close-modal" id="modalCloseBtn" title="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="rm-modal-body" id="previewBody">
                <!-- iframe o spinner aquí -->
            </div>
        </div>
    </div>

    <!-- ═══ TOAST ═══ -->
    <div class="rm-toast" id="toast" style="display:none;"></div>

</div>

<script src="restricciones-viewer.js"></script>
</body>
</html>
