<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remisiones Médicas Ocupacionales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="remisiones-view.css">
</head>
<body>

<div class="rem-wrapper">

    <!-- Header System v2.0 -->
    <header class="kair-header" style="background: #ffffff; border-bottom: 1px solid #dee2e6; position: sticky; top: 0; z-index: 100;">
        <div style="display: flex; align-items: center; justify-content: flex-start; gap: 0.75rem; min-height: 52px; padding: 0 1.5rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <button id="backBtn" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #5a6378; border-radius: 0.375rem; cursor: pointer;">
                    <i class="bi bi-arrow-left"></i>
                </button>
            </div>
            <div style="width: 1px; height: 24px; background: #dee2e6;"></div>
            <div style="display: flex; flex-direction: column; gap: 0.125rem;">
                <h1 style="font-size: 1.25rem; font-weight: 600; color: #1a1a2e; margin: 0;">
                    <i class="fas fa-file-medical" style="color: #174ea6;"></i>
                    Ver Remisiones Médicas
                </h1>
                <ol style="display: flex; align-items: center; gap: 0.375rem; list-style: none; margin: 0; padding: 0; font-size: 0.8125rem; color: #5a6378;">
                    <li><a href="#" style="color: #5a6378; text-decoration: none;">Gestión de la Salud</a></li>
                    <li>›</li>
                    <li><a href="#" style="color: #5a6378; text-decoration: none;">3.1.6</a></li>
                    <li>›</li>
                    <li style="color: #174ea6; font-weight: 500;">Ver Remisiones</li>
                </ol>
            </div>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 0.75rem;">
                <span style="display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; color: #5a6378;">
                    <i class="bi bi-building"></i>
                    <span id="header-company-text">—</span>
                </span>
                <button class="rem-btn-icon" id="refreshBtn" title="Actualizar">
                    <i class="fas fa-sync-alt" id="refreshIcon"></i>
                </button>
            </div>
        </div>
    </header>

        <!-- Contenido principal con scroll -->
        <div class="rem-body">

            <!-- Tarjetas de estadísticas -->
            <div class="rem-stats-row">
                <div class="rem-stat-card rem-stat-total">
                    <div class="rem-stat-icon">
                        <i class="fas fa-file-medical"></i>
                    </div>
                    <div class="rem-stat-info">
                        <span class="rem-stat-value" id="statTotal">0</span>
                        <span class="rem-stat-label">Total Documentos</span>
                    </div>
                </div>
                <div class="rem-stat-card rem-stat-folders">
                    <div class="rem-stat-icon">
                        <i class="fas fa-folder-open"></i>
                    </div>
                    <div class="rem-stat-info">
                        <span class="rem-stat-value" id="statFolders">0</span>
                        <span class="rem-stat-label">Carpetas</span>
                    </div>
                </div>
                <div class="rem-stat-card rem-stat-year">
                    <div class="rem-stat-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="rem-stat-info">
                        <span class="rem-stat-value" id="statCurrentYear">0</span>
                        <span class="rem-stat-label" id="statYearLabel">Este Año</span>
                    </div>
                </div>
            </div>

            <!-- Filtros por tipo de archivo -->
            <div class="rem-filters">
                <button class="rem-filter-btn active" data-filter="todos">
                    <i class="fas fa-list"></i> Todos
                </button>
                <button class="rem-filter-btn" data-filter="pdf">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="rem-filter-btn" data-filter="word">
                    <i class="fas fa-file-word"></i> Word
                </button>
                <button class="rem-filter-btn" data-filter="excel">
                    <i class="fas fa-file-excel"></i> Excel
                </button>
            </div>

            <!-- Barra de búsqueda -->
            <div class="rem-search-bar">
                <i class="fas fa-search rem-search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre de documento..." class="rem-search-input">
                <button id="clearSearchBtn" class="rem-search-clear hidden" title="Limpiar búsqueda">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Lista de documentos agrupados por año -->
            <div id="documentsList" class="rem-list">
                <!-- Se llena dinámicamente -->
            </div>

        </div>

        <!-- Modal de previsualización -->
        <div id="previewModal" class="rem-modal hidden">
            <div class="rem-modal-overlay" id="previewOverlay"></div>
            <div class="rem-modal-content">
                <div class="rem-modal-header">
                    <h3 id="previewTitle">Previsualización</h3>
                    <button id="closePreviewBtn" class="rem-modal-close" aria-label="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="rem-modal-body" id="previewBody">
                    <!-- PDF iframe o loading -->
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="rem-toast" role="alert">
            <div id="toastIcon" class="rem-toast-icon"></div>
            <div class="rem-toast-content">
                <p id="toastTitle" class="rem-toast-title"></p>
                <p id="toastMessage" class="rem-toast-message"></p>
            </div>
            <button id="toastClose" class="rem-toast-close" aria-label="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

    </div>

    <script src="remisiones-viewer.js"></script>
</body>
</html>
