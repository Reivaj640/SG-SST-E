<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K+AIR | Portal Investigación de Accidentes</title>
    <!-- 📦780 — Tipografía premium (DM Sans + Manrope). Sin CDN de iconos: SVG inline. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           📦780 — Portal premium v2. TODO bajo .inv-portal-scope (es un
           iframe, pero se scopea igual para no depender del aislamiento).
           Tokens alineados a la paleta canónica (shared/kair-design-tokens.css).
           ============================================================ */
        .inv-portal-scope {
            --invp-bg: #fbfcfb;
            --invp-card: #ffffff;
            --invp-line: #e8ebee;
            --invp-ink: #14213d;
            --invp-muted: #748096;
            --invp-faint: #aab1bd;
            --invp-blue: #2057b8;
            --invp-blue-soft: #eaf1fb;
            --invp-green: #1bb888;
            --invp-green-soft: #e6f5ef;
            --invp-amber: #e7a224;
            --invp-amber-soft: #fbf0db;
            --invp-violet: #7c4dbe;
            --invp-violet-soft: #f1eafb;
            --invp-radius: 20px;
            --invp-font: 'DM Sans', system-ui, -apple-system, sans-serif;
            --invp-font-display: 'Manrope', 'DM Sans', sans-serif;
            --invp-shadow: 0 2px 7px rgba(37, 56, 82, .08);
            --invp-t: 180ms ease-out;

            box-sizing: border-box;
            min-height: 100%;
            padding: 22px clamp(16px, 2vw, 32px) 34px;
            background: var(--invp-bg);
            color: var(--invp-ink);
            font-family: var(--invp-font);
            font-size: 14px;
        }
        .inv-portal-scope *,
        .inv-portal-scope *::before,
        .inv-portal-scope *::after { box-sizing: border-box; }

        [data-theme="dark"] .inv-portal-scope,
        [data-theme="dark-legacy"] .inv-portal-scope {
            --invp-bg: #0f172a;
            --invp-card: #1a2334;
            --invp-line: #2f3d55;
            --invp-ink: #e8edf5;
            --invp-muted: #a9b4c6;
            --invp-faint: #748096;
            --invp-blue: #6ea8fe;
            --invp-blue-soft: rgba(110, 168, 254, .16);
            --invp-green: #3ecf9a;
            --invp-green-soft: rgba(62, 207, 154, .16);
            --invp-amber: #f0b45a;
            --invp-amber-soft: rgba(240, 180, 90, .16);
            --invp-violet: #a98bf0;
            --invp-violet-soft: rgba(169, 139, 240, .16);
            --invp-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .4);
        }

        .inv-portal-scope .invp-portal { max-width: none; width: 100%; }

        /* ── Breadcrumb ── */
        .inv-portal-scope .invp-breadcrumb {
            display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
            font-size: 12.5px; color: var(--invp-faint); margin-bottom: 14px;
        }
        .inv-portal-scope .invp-breadcrumb strong { color: var(--invp-ink); font-weight: 700; }
        .inv-portal-scope .invp-sep { opacity: .7; }

        /* ── Header ── */
        .inv-portal-scope .invp-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
        }
        .inv-portal-scope .invp-head-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .inv-portal-scope .invp-head-icon {
            width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--invp-blue-soft); color: var(--invp-blue);
        }
        .inv-portal-scope .invp-head-icon svg { width: 23px; height: 23px; }
        .inv-portal-scope .invp-title {
            font-family: var(--invp-font-display); font-size: 22px; font-weight: 800;
            letter-spacing: -.01em; line-height: 1.2; margin: 0;
        }
        .inv-portal-scope .invp-sub { font-size: 13px; color: var(--invp-muted); margin: 3px 0 0; }
        .inv-portal-scope .invp-back {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 15px; font-family: inherit; font-size: 13px; font-weight: 600;
            color: var(--invp-blue); background: var(--invp-card);
            border: 1px solid var(--invp-line); border-radius: 11px; cursor: pointer;
            transition: background var(--invp-t), border-color var(--invp-t);
        }
        .inv-portal-scope .invp-back svg { width: 15px; height: 15px; }
        .inv-portal-scope .invp-back:hover { background: var(--invp-blue-soft); border-color: var(--invp-blue); }

        /* ── KPIs ── */
        .inv-portal-scope .invp-kpis {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px; margin-bottom: 24px;
        }
        .inv-portal-scope .invp-kpi {
            display: flex; align-items: center; gap: 13px;
            background: var(--invp-card); border: 1px solid var(--invp-line);
            border-radius: var(--invp-radius); box-shadow: var(--invp-shadow); padding: 16px 18px;
        }
        .inv-portal-scope .invp-kpi__icon {
            width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: var(--invp-amber-soft); color: var(--invp-amber);
        }
        .inv-portal-scope .invp-kpi--green .invp-kpi__icon { background: var(--invp-green-soft); color: var(--invp-green); }
        .inv-portal-scope .invp-kpi__icon svg { width: 21px; height: 21px; }
        .inv-portal-scope .invp-kpi__value { font-family: var(--invp-font-display); font-size: 26px; font-weight: 800; line-height: 1.05; letter-spacing: -.03em; }
        .inv-portal-scope .invp-kpi__label { font-size: 11.5px; color: var(--invp-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-top: 2px; }

        /* ── Acciones principales ── */
        .inv-portal-scope .invp-actions {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px; margin-bottom: 30px;
        }
        .inv-portal-scope .invp-action {
            display: flex; align-items: center; gap: 16px; text-align: left;
            padding: 22px; font-family: inherit; color: var(--invp-ink);
            background: var(--invp-card); border: 1px solid var(--invp-line);
            border-radius: 18px; box-shadow: var(--invp-shadow); cursor: pointer;
            transition: transform var(--invp-t), border-color var(--invp-t);
        }
        .inv-portal-scope .invp-action:hover { transform: translateY(-2px); border-color: var(--invp-blue); }
        .inv-portal-scope .invp-action-icon {
            width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--invp-blue-soft); color: var(--invp-blue);
        }
        .inv-portal-scope .invp-action-icon svg { width: 24px; height: 24px; }
        .inv-portal-scope .invp-action--primary {
            background: linear-gradient(135deg, var(--invp-blue) 0%, #172c4c 100%);
            border-color: transparent; color: #fff;
        }
        .inv-portal-scope .invp-action--primary .invp-action-icon { background: rgba(255, 255, 255, .18); color: #fff; }
        .inv-portal-scope .invp-action--primary .invp-action-title { color: #fff; }
        .inv-portal-scope .invp-action--primary .invp-action-desc { color: rgba(255, 255, 255, .85); }
        .inv-portal-scope .invp-action--primary:hover { border-color: transparent; }
        .inv-portal-scope .invp-action--see .invp-action-icon { background: var(--invp-blue-soft); color: var(--invp-blue); }
        .inv-portal-scope .invp-action-title { display: block; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .inv-portal-scope .invp-action-desc { display: block; font-size: 12.5px; color: var(--invp-muted); line-height: 1.45; }

        /* ── Herramientas ── */
        .inv-portal-scope .invp-quick-title { font-family: var(--invp-font-display); font-size: 15px; font-weight: 700; margin: 0 0 14px; }
        .inv-portal-scope .invp-quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
        .inv-portal-scope .invp-quick-card {
            display: flex; flex-direction: column; align-items: flex-start; text-align: left;
            gap: 10px; padding: 18px; font-family: inherit; color: var(--invp-ink);
            background: var(--invp-card); border: 1px solid var(--invp-line);
            border-radius: 16px; cursor: pointer;
            transition: transform var(--invp-t), border-color var(--invp-t), box-shadow var(--invp-t);
        }
        .inv-portal-scope .invp-quick-card:hover { transform: translateY(-2px); border-color: var(--invp-blue); box-shadow: var(--invp-shadow); }
        .inv-portal-scope .invp-quick-icon {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: var(--invp-blue-soft); color: var(--invp-blue);
        }
        .inv-portal-scope .invp-quick-icon svg { width: 20px; height: 20px; }
        .inv-portal-scope .invp-quick-icon--green { background: var(--invp-green-soft); color: var(--invp-green); }
        .inv-portal-scope .invp-quick-icon--amber { background: var(--invp-amber-soft); color: var(--invp-amber); }
        .inv-portal-scope .invp-quick-icon--violet { background: var(--invp-violet-soft); color: var(--invp-violet); }
        .inv-portal-scope .invp-quick-name { display: block; font-weight: 700; font-size: 13.5px; }
        .inv-portal-scope .invp-quick-desc { display: block; font-size: 12px; color: var(--invp-muted); line-height: 1.45; }

        @media (max-width: 720px) {
            .inv-portal-scope .invp-actions { grid-template-columns: 1fr; }
            .inv-portal-scope .invp-kpis { grid-template-columns: 1fr; }
            .inv-portal-scope .invp-title { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="inv-portal-scope">
    <div class="invp-portal">

        <nav class="invp-breadcrumb" aria-label="Ruta de navegación">
            <span>Gestión de la Salud</span>
            <span class="invp-sep">›</span>
            <span>3.2.2</span>
            <span class="invp-sep">›</span>
            <strong>Investigación de Accidentes e Incidentes</strong>
        </nav>

        <div class="invp-head">
            <div class="invp-head-left">
                <span class="invp-head-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                </span>
                <div>
                    <h1 class="invp-title">Investigación de Accidentes e Incidentes</h1>
                    <p class="invp-sub">Gestión de la Salud · 3.2.2 · Análisis de causa raíz con IA</p>
                </div>
            </div>
            <button class="invp-back" type="button" onclick="goBackToModule()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>Volver al Menú</span>
            </button>
        </div>

        <div class="invp-kpis">
            <div class="invp-kpi">
                <span class="invp-kpi__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
                <div><div class="invp-kpi__value" id="investigacionesPendientes">0</div><div class="invp-kpi__label">Pendientes</div></div>
            </div>
            <div class="invp-kpi invp-kpi--green">
                <span class="invp-kpi__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
                <div><div class="invp-kpi__value" id="investigacionesCompletadas">0</div><div class="invp-kpi__label">Completadas</div></div>
            </div>
        </div>

        <div class="invp-actions">
            <button class="invp-action invp-action--primary" type="button" onclick="realizarInvestigacion()">
                <span class="invp-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
                </span>
                <span>
                    <span class="invp-action-title">Realizar Investigación</span>
                    <span class="invp-action-desc">Inicia una nueva investigación con análisis automático de causa raíz mediante IA.</span>
                </span>
            </button>

            <button class="invp-action invp-action--see" type="button" onclick="verInvestigaciones()">
                <span class="invp-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
                </span>
                <span>
                    <span class="invp-action-title">Ver Investigaciones</span>
                    <span class="invp-action-desc">Consulta y revisa las investigaciones de accidentes ya realizadas.</span>
                </span>
            </button>
        </div>

        <section class="invp-quick">
            <h2 class="invp-quick-title">Herramientas y Configuración</h2>
            <div class="invp-quick-grid">
                <button class="invp-quick-card" type="button" onclick="abrirEstadisticas()">
                    <span class="invp-quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="4" width="3" height="14" rx="1"/></svg></span>
                    <span class="invp-quick-name">Estadísticas</span>
                    <span class="invp-quick-desc">Visualiza gráficos y tendencias de accidentes e incidentes.</span>
                </button>

                <button class="invp-quick-card" type="button" onclick="abrirPlantillas()">
                    <span class="invp-quick-icon invp-quick-icon--amber" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg></span>
                    <span class="invp-quick-name">Plantillas</span>
                    <span class="invp-quick-desc">Gestiona las plantillas de informes de investigación.</span>
                </button>

                <button class="invp-quick-card" type="button" onclick="exportarDatos()">
                    <span class="invp-quick-icon invp-quick-icon--green" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
                    <span class="invp-quick-name">Exportar Datos</span>
                    <span class="invp-quick-desc">Genera reportes consolidados en Excel o PDF.</span>
                </button>

                <button class="invp-quick-card" type="button" onclick="abrirConfiguracion()">
                    <span class="invp-quick-icon invp-quick-icon--violet" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                    <span class="invp-quick-name">Configuración</span>
                    <span class="invp-quick-desc">Ajusta parámetros del módulo de investigación.</span>
                </button>
            </div>
        </section>

    </div>
</div>

<script src="investigacion-home.js?v=INV-20260924-hf-config"></script>
</body>
</html>
