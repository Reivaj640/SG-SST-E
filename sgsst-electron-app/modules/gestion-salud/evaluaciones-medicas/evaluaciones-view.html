<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Evaluaciones Médicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="evaluaciones-viewer.css">
</head>
<body>
    <div class="document-viewer-wrapper">
        <!-- Header -->
        <div class="k-section-card" style="padding:0; margin-bottom:0;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.25rem 1.5rem;">
                <div style="display:flex; align-items:center; gap:0.75rem;">
                    <i class="fas fa-file-medical" style="color:#174ea6; font-size:1.25rem;"></i>
                    <div>
                        <h3 style="font-size:1.125rem; font-weight:600; margin:0; color:#1E293B;">Evaluaciones Médicas Ocupacionales</h3>
                        <p style="font-size:0.8125rem; color:#64748B; margin:0.25rem 0 0 0;">Gestión de la Salud — 3.1.4</p>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:0.75rem;">
                    <span class="k-section-card__company">
                        <i class="bi bi-building"></i>
                        <span id="header-company-text">—</span>
                    </span>
                    <div class="k-section-card__divider"></div>
                    <button class="header-back-btn" id="backBtn" title="Volver al módulo">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="sidebar">
                <h3>Carpetas de Documentos</h3>
                <div id="folderList">
                    <!-- Las carpetas se cargarán dinámicamente -->
                </div>
                <h3 style="margin-top: 20px;">Documentos en Carpeta</h3>
                <div id="documentList">
                    <!-- Los documentos se cargarán dinámicamente aquí -->
                </div>
            </div>
            <div class="main-content">
                <div class="document-info">
                    <div class="document-title" id="documentTitle">Selecciona un documento</div>
                    <div class="document-actions">
                        <div class="toolbar-group">
                            <label for="zoomLevel">Zoom:</label>
                            <select id="zoomLevel">
                                <option value="auto">Auto</option>
                                <option value="page-width">Ancho de página</option>
                                <option value="page-height">Alto de página</option>
                                <option value="50%">50%</option>
                                <option value="75%">75%</option>
                                <option value="100%">100%</option>
                                <option value="125%">125%</option>
                                <option value="150%">150%</option>
                                <option value="200%">200%</option>
                            </select>
                        </div>
                        <div class="toolbar-group">
                            <label for="pageOrientation">Orientación:</label>
                            <select id="pageOrientation">
                                <option value="vertical">Vertical</option>
                                <option value="horizontal">Horizontal</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="document-viewer-container">
                    <div class="loading" id="loadingDiv">
                        <div class="spinner"></div>
                        <p>Cargando documento...</p>
                    </div>
                    <div id="viewerContainer" style="display: none;">
                        <!-- El visor de documento se cargará aquí -->
                    </div>
                </div>
            </div>
        </div>
        <div class="notification" id="notification">
            <i class="notification-icon fas fa-check-circle"></i>
            <div class="notification-message">Operación completada con éxito</div>
        </div>
    </div>
    <script src="evaluaciones-viewer.js"></script>
</body>
</html>
