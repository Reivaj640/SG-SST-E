<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Evaluaciones Médicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="evaluaciones-viewer.css">
</head>
<body>
    <div class="document-viewer-wrapper">
        <!-- Header System v2.0 -->
        <header class="kair-header" style="background: #ffffff; border-bottom: 1px solid #dee2e6; position: sticky; top: 0; z-index: 100;">
            <div style="display: flex; align-items: center; justify-content: flex-start; gap: 0.75rem; min-height: 52px; padding: 0 1.5rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button id="backBtn" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #5a6378; border-radius: 0.375rem; cursor: pointer;">
                        <i class="bi bi-arrow-left"></i>
                    </button>
                </div>
                <div style="width: 1px; height: 24px; background: #dee2e6;"></div>
                <div style="display: flex; flex-direction: column; gap: 0.125rem;">
                    <h1 style="font-size: 1.25rem; font-weight: 600; color: #1a1a2e; margin: 0;">
                        <i class="fas fa-file-medical" style="color: #174ea6;"></i>
                        Evaluaciones Médicas Ocupacionales
                    </h1>
                    <ol style="display: flex; align-items: center; gap: 0.375rem; list-style: none; margin: 0; padding: 0; font-size: 0.8125rem; color: #5a6378;">
                        <li><a href="#" style="color: #5a6378; text-decoration: none;">Gestión de la Salud</a></li>
                        <li>›</li>
                        <li style="color: #174ea6; font-weight: 500;">3.1.4 Evaluaciones Médicas</li>
                    </ol>
                </div>
                <div style="margin-left: auto; display: flex; align-items: center; gap: 0.75rem;">
                    <span style="display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; color: #5a6378;">
                        <i class="bi bi-building"></i>
                        <span id="header-company-text">—</span>
                    </span>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="sidebar">
                <h3>Carpetas de Documentos</h3>
                <div id="folderList">
                    <!-- Las carpetas se cargarán dinámicamente -->
                </div>
                <h3 style="margin-top: 20px;">Documentos en Carpeta</h3>
                <div id="documentList">
                    <!-- Los documentos se cargarán dinámicamente aquí -->
                </div>
            </div>
            <div class="main-content">
                <div class="document-info">
                    <div class="document-title" id="documentTitle">Selecciona un documento</div>
                    <div class="document-actions">
                        <div class="toolbar-group">
                            <label for="zoomLevel">Zoom:</label>
                            <select id="zoomLevel">
                                <option value="auto">Auto</option>
                                <option value="page-width">Ancho de página</option>
                                <option value="page-height">Alto de página</option>
                                <option value="50%">50%</option>
                                <option value="75%">75%</option>
                                <option value="100%">100%</option>
                                <option value="125%">125%</option>
                                <option value="150%">150%</option>
                                <option value="200%">200%</option>
                            </select>
                        </div>
                        <div class="toolbar-group">
                            <label for="pageOrientation">Orientación:</label>
                            <select id="pageOrientation">
                                <option value="vertical">Vertical</option>
                                <option value="horizontal">Horizontal</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="document-viewer-container">
                    <div class="loading" id="loadingDiv">
                        <div class="spinner"></div>
                        <p>Cargando documento...</p>
                    </div>
                    <div id="viewerContainer" style="display: none;">
                        <!-- El visor de documento se cargará aquí -->
                    </div>
                </div>
            </div>
        </div>
        <div class="notification" id="notification">
            <i class="notification-icon fas fa-check-circle"></i>
            <div class="notification-message">Operación completada con éxito</div>
        </div>
    </div>
    <script src="evaluaciones-viewer.js"></script>
</body>
</html>
