<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K+AIR | Portal Rendición de Cuentas</title>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           SISTEMA VISUAL OFICIAL (K+AIR)
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        :root {
            --primary: #174ea6;
            --primary-hover: #185abd;
            --primary-light: #e8f0fe;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --border: #dee2e6;
            --radius: 0.5rem;
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            font-size: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* PORTAL CONTENEDOR PRINCIPAL */
        .portal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .portal-card {
            background: white;
            width: 100%;
            max-width: 1100px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 3rem;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* BARRA SUPERIOR INTERNA DEL PORTAL */
        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f3f5;
        }

        .portal-logo {
            font-family: 'Lexend', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn-internal {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            background: #f8f9fa;
            border: 1px solid var(--border);
        }

        .back-btn-internal:hover {
            color: var(--primary);
            background: var(--primary-light);
            border-color: var(--primary);
        }

        /* HERO SECTION */
        .hero-title {
            font-family: 'Lexend', sans-serif;
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* INFO CARDS */
        .info-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .info-card {
            background: var(--bg-body);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: left;
            border: 1px solid var(--border);
        }

        .info-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .info-card-icon.primary { background: var(--primary-light); color: var(--primary); }
        .info-card-icon.success { background: #d4edda; color: var(--success); }
        .info-card-icon.warning { background: #fff3cd; color: var(--warning); }

        .info-card-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .info-card-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* BOTÓN PRINCIPAL - ENTRADA */
        .main-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 1rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(23, 78, 166, 0.3);
            margin: 2.5rem 0; /* Centrado vertical perfecto entre widgets */
        }

        .main-action-btn:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(23, 78, 166, 0.4);
        }
        
        .main-action-btn i {
            font-size: 1.3rem;
        }

        /* ACCIONES SECUNDARIAS */
        .secondary-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .secondary-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dark);
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
        }

        .secondary-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-light);
        }

        /* LOADING OVERLAY */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 9999;
        }

        .loading-overlay.active { display: flex; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Cargando...</div>
    </div>

    <!-- Portal Contenedor -->
    <div class="portal-container">
        <div class="portal-card">
            <!-- Header -->
            <div class="portal-header">
                <button class="back-btn-internal" onclick="goBackToModule()" title="Volver al módulo principal">
                    <i class="bi bi-arrow-left"></i>
                    <span>Volver al Módulo</span>
                </button>
                <div class="portal-logo">
                    <i class="bi bi-file-earmark-check"></i>
                    K+AIR RENDICIÓN
                </div>
            </div>

            <!-- Hero Section -->
            <h1 class="hero-title">📊 Rendición de Cuentas SG-SST</h1>
            <p class="hero-subtitle">
                Gestiona el informe anual de rendición de cuentas del Sistema de Gestión de Seguridad y Salud en el Trabajo
            </p>

            <!-- Info Cards -->
            <div class="info-cards-grid">
                <div class="info-card">
                    <div class="info-card-icon primary">
                        <i class="bi bi-calendar-check"></i>
                    </div>
                    <div class="info-card-label">Periodo Activo</div>
                    <div class="info-card-value" id="activePeriod">2024</div>
                </div>

                <div class="info-card">
                    <div class="info-card-icon success">
                        <i class="bi bi-people"></i>
                    </div>
                    <div class="info-card-label">Trabajadores</div>
                    <div class="info-card-value" id="workersCount">154</div>
                </div>

                <div class="info-card">
                    <div class="info-card-icon warning">
                        <i class="bi bi-file-earmark-text"></i>
                    </div>
                    <div class="info-card-label">Estado del Informe</div>
                    <div class="info-card-value" id="reportStatus" style="font-size: 1rem;">En elaboración</div>
                </div>
            </div>

            <!-- Botón Principal -->
            <button class="main-action-btn" onclick="enterRendicion()">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Entrar a Rendición de Cuentas</span>
            </button>

            <!-- Acciones Secundarias -->
            <div class="secondary-actions">
                <button class="secondary-btn" onclick="importFromExcel()">
                    <i class="bi bi-file-earmark-excel"></i>
                    <span>Importar Excel</span>
                </button>

                <button class="secondary-btn" onclick="exportReport()">
                    <i class="bi bi-download"></i>
                    <span>Exportar Informe</span>
                </button>

                <button class="secondary-btn" onclick="viewHistory()">
                    <i class="bi bi-clock-history"></i>
                    <span>Ver Historial</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script del portal -->
    <script src="./rendicion-home.js"></script>
</body>
</html>
