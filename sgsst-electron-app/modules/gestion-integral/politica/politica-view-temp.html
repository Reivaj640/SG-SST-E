<head>

    <style>
        /*
         * SISTEMA VISUAL K+AIR V2.0
         * Evolución hacia interfaces más limpias y funcionales
         */
        :root {
            --primary: #174ea6;
            --primary-dark: #0d3b8e;
            --primary-light: #e8f0fe;
            --primary-subtle: #f5f9ff;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --bg-body: #f3f4f6;
            --bg-sidebar: #ffffff;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 0.5rem;
            --sidebar-width: 280px;
            --header-height: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER MODERNO --- */
        .app-header {
            height: var(--header-height);
            background: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
            z-index: 20;
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }
        .brand-box { display: flex; align-items: center; gap: 0.75rem; }
        .app-logo {
            width: 32px; height: 32px; background: var(--primary);
            color: white; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .app-title { font-family: 'Lexend', sans-serif; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
        .context-pill {
            background: var(--primary-subtle); color: var(--primary);
            font-size: 0.75rem; padding: 4px 10px; border-radius: 99px; font-weight: 600;
            border: 1px solid rgba(23, 78, 166, 0.1);
        }

        /* --- LAYOUT PRINCIPAL --- */
        .app-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR: NAVIGATOR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-nav {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-back-btn {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .nav-back-btn:hover:not(:disabled) { background: var(--bg-body); }
        .nav-back-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .file-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .list-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            margin-top: 1.25rem;
        }
        .list-section-title:first-child { margin-top: 0; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .file-item:hover { background: var(--bg-body); }
        .file-item.active { background: var(--primary-light); }
        .file-item.selected { background: var(--primary-subtle); border: 1px solid var(--primary); }

        .file-icon {
            width: 32px; height: 32px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            background: #e5e7eb; color: var(--text-secondary);
            flex-shrink: 0;
        }
        .icon-folder { background: #fef3c7; color: #d97706; }
        .icon-pdf { background: #fee2e2; color: #dc2626; }
        .icon-xls { background: #dcfce7; color: #16a34a; }
        .icon-doc { background: #e0e7ff; color: #4f46e5; }

        .file-info { flex: 1; min-width: 0; }
        .file-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            flex: 1;
            background: #e5e7eb;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .empty-state-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-body);
        }

        .empty-illustration {
            width: 80px; height: 80px;
            background: white;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            color: var(--primary);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
        }

        /* --- DOCUMENT WRAPPER --- */
        .document-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
            background: #525659;
            position: absolute;
            inset: 0;
            z-index: 5;
        }
        .document-wrapper.active { display: flex; }

        /* --- TOOLBAR --- */
        .doc-toolbar {
            height: 48px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
        }
        .doc-title-truncate {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .btn-icon {
            width: 36px; height: 36px; border-radius: 6px; border: none;
            background: transparent; color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; font-size: 1rem;
        }
        .btn-icon:hover { background: var(--bg-body); color: var(--primary); }
        .btn-icon.active { background: var(--primary-light); color: var(--primary); }
        .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-primary-sm {
            background: var(--primary); color: white; border: none;
            padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: background 0.2s;
        }
        .btn-primary-sm:hover { background: var(--primary-dark); }
        .btn-primary-sm i { font-size: 0.8rem; }

        /* --- EDITOR DE TEXTO (Feature Clave) --- */
        .editor-layer {
            flex: 1; background: white; display: none; flex-direction: column;
            position: absolute; inset: 50px 0 0 0; z-index: 10;
            animation: slideUp 0.3s ease-out;
        }
        .editor-layer.active { display: flex; }

        .editor-toolbar {
            padding: 0.5rem 1rem; background: #f9fafb; border-bottom: 1px solid var(--border-color);
            display: flex; gap: 0.5rem; align-items: center;
        }

        .editor-canvas {
            flex: 1; padding: 3rem 4rem; overflow-y: auto; outline: none;
            font-size: 11pt; line-height: 1.5; color: #333;
            background: #525659; /* Keep contrast */
        }

        /* Simulación de hoja de papel */
        .paper-sheet {
            background: white; min-height: 1000px; width: 100%; max-width: 800px;
            margin: 2rem auto; padding: 3rem; box-shadow: var(--shadow-lg);
            outline: none;
        }

        /* Iframe Viewer */
        .viewer-frame {
            width: 100%; height: 100%; border: none;
            display: none;
            flex: 1;
            overflow: hidden;
        }
        .viewer-frame.active { display: flex; }

        /* Toast Notification */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: #1f2937; color: white; padding: 0.75rem 1.25rem;
            border-radius: 8px; box-shadow: var(--shadow-lg);
            display: flex; align-items: center; gap: 10px;
            transform: translateY(150%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .toast.show { transform: translateY(0); }
        .toast.success i { color: var(--success); }

        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
