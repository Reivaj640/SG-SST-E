<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Presupuesto - K+AIR</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           SISTEMA VISUAL K+AIR (CORE)
           ========================================= */
        :root {
            --k-primary: #174ea6;
            --k-primary-hover: #185abd;
            --k-primary-light: rgba(23, 78, 166, 0.1);
            --k-success: #28a745;
            --k-warning: #ffc107;
            --k-danger: #dc3545;
            --k-bg-app: #f8f9fa;
            --k-bg-card: #ffffff;
            --k-border: #dee2e6;
            --k-text-main: #212529;
            --k-text-muted: #6c757d;
            --k-radius-md: 0.375rem;
            --k-radius-lg: 0.5rem;
            --k-shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
            --k-header-height: 60px;
            --k-font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--k-font-family);
            background-color: var(--k-bg-app);
            color: var(--k-text-main);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* HEADER */
        header {
            background-color: var(--k-bg-card);
            border-bottom: 1px solid var(--k-border);
            padding: 0 1.5rem;
            height: var(--k-header-height);
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; z-index: 20;
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }
        .k-module-title { font-size: 1.2rem; font-weight: 600; color: var(--k-primary); line-height: 1.2; }
        .k-module-subtitle { font-size: 0.8rem; color: var(--k-text-muted); font-weight: 400; }

        .header-actions { display: flex; gap: 0.75rem; }

        /* BOTONES */
        .k-btn {
            border: 1px solid var(--k-border); background: white;
            color: var(--k-text-main); padding: 0.5rem 1rem;
            border-radius: var(--k-radius-md); font-size: 0.9rem; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
            transition: all 0.2s;
        }
        .k-btn:hover { background: #f8f9fa; border-color: var(--k-text-muted); }

        .k-btn-primary { background: var(--k-primary); color: white; border-color: var(--k-primary); }
        .k-btn-primary:hover { background: var(--k-primary-hover); }

        .k-btn-success { background: var(--k-success); color: white; border-color: var(--k-success); }
        .k-btn-success:hover { background: #218838; }
        
        /* CONTENIDO PRINCIPAL */
        .content-wrapper {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; padding: 1.5rem; gap: 1.5rem;
        }

        /* KPI CARDS */
        .kpi-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;
            flex-shrink: 0;
        }

        .kpi-card {
            background: var(--k-bg-card); border: 1px solid var(--k-border);
            border-radius: var(--k-radius-lg); padding: 1.25rem;
            box-shadow: var(--k-shadow-sm); display: flex; flex-direction: column;
            border-left: 4px solid transparent; /* Indicador de color */
        }
        
        .kpi-label { font-size: 0.8rem; color: var(--k-text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 0.5rem; }
        .kpi-value { font-size: 1.5rem; font-weight: 700; color: var(--k-text-main); }
        
        /* Bordes de color semántico */
        .kpi-card:nth-child(1) { border-left-color: var(--k-primary); }
        .kpi-card:nth-child(2) { border-left-color: var(--k-warning); }
        .kpi-card:nth-child(3) { border-left-color: var(--k-success); }
        .kpi-card:nth-child(4) { border-left-color: #17a2b8; }

        /* TABLA STICKY */
        .table-wrapper {
            flex: 1; overflow: auto;
            background: var(--k-bg-card); border: 1px solid var(--k-border);
            border-radius: var(--k-radius-lg); box-shadow: var(--k-shadow-sm);
            position: relative;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; table-layout: fixed; }

        thead th {
            background: #f8f9fa; position: sticky; top: 0; z-index: 10;
            padding: 1rem; text-align: left; font-weight: 600; color: var(--k-text-muted);
            border-bottom: 2px solid var(--k-border); white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); /* Sombra sutil para separar header */
        }

        tbody td {
            padding: 0.75rem 1rem; border-bottom: 1px solid var(--k-border);
            vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        tbody tr:hover { background-color: rgba(23, 78, 166, 0.03); }

        /* INPUTS EDITABLES */
        .editable-cell-input {
            width: 100%; padding: 0.4rem 0.6rem;
            border: 1px solid transparent; border-radius: 4px; background: transparent;
            font-family: inherit; font-size: inherit; color: inherit;
            transition: all 0.2s;
        }
        .editable-cell-input:hover { background: #f1f3f4; }
        .editable-cell-input:focus {
            background: white; border-color: var(--k-primary);
            outline: none; box-shadow: 0 0 0 2px var(--k-primary-light);
        }
        
        /* Estilos para Celdas Editables */
        .editable-cell {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: block;
            min-height: 1.5em;
        }

        .editable-cell:hover {
            background-color: #f0f0f0;
            color: var(--k-primary);
        }

        .formula-cell {
            color: #777;
            background-color: #f4f4f4;
            cursor: not-allowed;
            display: block;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* ACTIONS COLUMN */
        .actions-col { width: 100px; text-align: center; }
        .action-btn {
            color: var(--k-text-muted); cursor: pointer; margin: 0 0.4rem; font-size: 1rem;
            transition: color 0.2s; background: none; border: none; padding: 0.25rem;
        }
        .action-btn:hover { color: var(--k-primary); transform: scale(1.1); }
        .action-btn.delete-btn:hover { color: var(--k-danger); }

        /* NOTIFICACIÓN */
        .k-toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: white; padding: 1rem 1.5rem;
            border-radius: var(--k-radius-lg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            display: flex; align-items: center; gap: 0.75rem;
            transform: translateY(150%); transition: transform 0.3s;
            z-index: 2000; border-left: 4px solid var(--k-primary); font-weight: 500;
        }
        .k-toast.show { transform: translateY(0); }
        .k-toast.success { border-left-color: var(--k-success); }
        .k-toast.warning { border-left-color: var(--k-warning); }
        .k-toast.error { border-left-color: var(--k-danger); }
        .k-toast.info { border-left-color: var(--k-primary); }

        /* SPINNER */
        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(23,78,166,0.2);
            border-top-color: var(--k-primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="k-btn" id="backToSelectorBtn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="k-btn" id="backToSubmodulesBtn">
                <i class="fas fa-home"></i>
            </button>
            <div>
                <div class="k-module-title" id="moduleTitle">Gestión Presupuestal</div>
                <div class="k-module-subtitle">Asignación y Control de Recursos</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="k-btn" id="backBtn" style="display:none;">Volver</button>
            <button class="k-btn k-btn-primary" id="addRowBtn">
                <i class="fas fa-plus"></i> Nueva Partida
            </button>
            <button class="k-btn k-btn-success" id="saveBtn">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
        </div>
    </header>

    <div class="content-wrapper">
        <!-- KPIs -->
        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-label">Presupuesto Total</div>
                <div class="kpi-value" id="totalPresupuesto">$0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Aporte Empresa (Ejecutado)</div>
                <div class="kpi-value" id="totalEmpresa">$0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">% Cumplimiento</div>
                <div class="kpi-value" id="totalArl">0%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Saldo Disponible</div>
                <div class="kpi-value" id="saldoDisponible">$0</div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-wrapper">
            <table id="budgetTable">
                <colgroup>
                    <col style="width: 50px;">   <!-- ID -->
                    <col style="width: 250px;"> <!-- Detalle -->
                    <col style="width: 130px;"> <!-- Asignación -->
                    <col style="width: 130px;"> <!-- Ejecutado -->
                    <col style="width: 70px;">   <!-- % -->
                    <!-- Meses -->
                    <col style="width: 100px;"> <col style="width: 100px;"> <col style="width: 100px;">
                    <col style="width: 100px;"> <col style="width: 100px;"> <col style="width: 100px;">
                    <col style="width: 100px;"> <col style="width: 100px;"> <col style="width: 100px;">
                    <col style="width: 100px;"> <col style="width: 100px;"> <col style="width: 100px;">
                    <col style="width: 100px;">  <!-- Acciones -->
                </colgroup>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Concepto / Detalle</th>
                        <th>Asignado</th>
                        <th>Ejecutado</th>
                        <th>%</th>
                        <th>Ene</th> <th>Feb</th> <th>Mar</th> <th>Abr</th> <th>May</th> <th>Jun</th>
                        <th>Jul</th> <th>Ago</th> <th>Sep</th> <th>Oct</th> <th>Nov</th> <th>Dic</th>
                        <th class="actions-col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="budgetTableBody">
                    <!-- JS inyectará filas aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- TOAST -->
    <div class="k-toast" id="notification">
        <i class="fas fa-info-circle notification-icon"></i>
        <span class="notification-message">Operación realizada</span>
    </div>

    <script>
        let budgetData = [];
        let calculationData = [];
        let currentFile = null;
        let formulaCells = [];
        let hasPendingChanges = false;

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();

            // Mensajes del padre
            window.addEventListener('message', async (event) => {
                if (event.source !== parent) return;

                if (event.data.file) {
                    currentFile = event.data.file;
                    updateFileInfo();
                    await loadData();
                } else if (event.data.budgetData) {
                    budgetData = event.data.budgetData;
                    calculationData = event.data.calculationData || budgetData;
                    if (event.data.formulaCells) formulaCells = event.data.formulaCells;
                    renderBudgetTable();
                    updateSummary();
                    markNoPendingChanges();
                }

                if (event.data.action === 'saveComplete' || (event.data.action === 'saveBudgetChanges' && event.data.success)) {
                    showNotification('Cambios guardados exitosamente', 'success');
                    markNoPendingChanges();
                } else if (event.data.action === 'saveError' || (event.data.action === 'saveBudgetChanges' && !event.data.success)) {
                    showNotification(`Error al guardar: ${event.data.error || 'Error desconocido'}`, 'error');
                }
            });
        });

        function setupEventListeners() {
            const backToSelector = () => {
                if (!hasPendingChanges || confirm('Tiene cambios sin guardar. ¿Está seguro de que desea salir?')) {
                    window.parent.postMessage({ action: 'backToSelector' }, '*');
                }
            };
            const backToSubmodules = () => {
                if (!hasPendingChanges || confirm('Tiene cambios sin guardar. ¿Está seguro de que desea salir?')) {
                    window.parent.postMessage({ action: 'backToSubmodules' }, '*');
                }
            };

            document.getElementById('backToSelectorBtn').addEventListener('click', backToSelector);
            document.getElementById('backToSubmodulesBtn').addEventListener('click', backToSubmodules);
            document.getElementById('addRowBtn').addEventListener('click', addNewRow);
            document.getElementById('saveBtn').addEventListener('click', saveChanges);
        }

        function updateFileInfo() {
            if (!currentFile) return;
            const year = extractYearFromFileName(currentFile.name);
            document.getElementById('moduleTitle').textContent = `Presupuesto ${year}`;
        }

        function extractYearFromFileName(fileName) {
            const yearMatch = fileName.match(/(20\d{2})/);
            return yearMatch ? yearMatch[1] : 'Desconocido';
        }

        async function loadData() {
            try {
                showLoading();
                window.parent.postMessage({ action: 'requestBudgetData', file: currentFile }, '*');
            } catch (error) {
                console.error('Error al cargar datos:', error);
                showNotification(`Error al cargar datos: ${error.message}`, 'error');
            }
        }

        function getCellAddress(rowIndex, propertyName) {
            const row = rowIndex + 10;
            const columnMap = {
                'id': 'A', 'detalle': 'C', 'asignacion': 'D', 'ejecutado_acumulado': 'E',
                'porcentaje_ejecutado': 'F', 'enero': 'G', 'febrero': 'H', 'marzo': 'I',
                'abril': 'J', 'mayo': 'K', 'junio': 'L', 'julio': 'M', 'agosto': 'N',
                'septiembre': 'O', 'octubre': 'P', 'noviembre': 'Q', 'diciembre': 'R'
            };
            const col = columnMap[propertyName];
            return col ? `${col}${row}` : null;
        }

        function markPendingChanges() {
            hasPendingChanges = true;
            const btn = document.getElementById('saveBtn');
            btn.classList.add('k-btn-primary');
            btn.classList.remove('k-btn-success');
            btn.innerHTML = '<i class="fas fa-save"></i> Guardar (Pendiente)';
        }

        function markNoPendingChanges() {
            hasPendingChanges = false;
            const btn = document.getElementById('saveBtn');
            btn.classList.remove('k-btn-primary');
            btn.classList.add('k-btn-success');
            btn.innerHTML = '<i class="fas fa-save"></i> Guardar Cambios';
        }

        function parseFormattedNumber(value) {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value;
            let clean = value.toString().replace(/\$/g, '').replace(/\s/g, '').replace(/,/g, '');
            const parsed = parseFloat(clean);
            return isNaN(parsed) ? 0 : parsed;
        }

        function formatNumber(num) {
            if (num === null || num === undefined || num === '') return '0,00';
            const numberValue = isNaN(parseFloat(num)) ? 0 : parseFloat(num);
            return numberValue.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function renderBudgetTable() {
            const tableBody = document.getElementById('budgetTableBody');
            tableBody.innerHTML = '';
            const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

            budgetData.forEach((item, index) => {
                const row = document.createElement('tr');
                const isSpecial = item.id === 'TOTAL AÑO' || item.id === 'ANALISIS PRESUPUESTAL';

                let monthHTML = '';
                months.forEach(m => {
                    const addr = getCellAddress(index, m);
                    if (formulaCells.includes(addr) || isSpecial) {
                        monthHTML += `<td><span class="formula-cell">${formatNumber(item[m] || 0)}</span></td>`;
                    } else {
                        monthHTML += `<td><span onclick="makeCellEditable(event, ${index}, '${m}')" class="editable-cell">${formatNumber(item[m] || 0)}</span></td>`;
                    }
                });

                const asignacion = parseFormattedNumber(item.asignacion || 0);
                const ejecutado = parseFormattedNumber(item.ejecutado_acumulado || 0);
                const pct = asignacion > 0 ? ((ejecutado / asignacion) * 100).toFixed(2) : 0;

                row.innerHTML = `
                    <td>${isSpecial ? item.id : index + 1}</td>
                    <td>${isSpecial ? item.id : item.detalle || '-'}</td>
                    <td>${isSpecial ? `<span class="formula-cell">${formatNumber(asignacion)}</span>` : `<span onclick="makeCellEditable(event, ${index}, 'asignacion')" class="editable-cell">${formatNumber(asignacion)}</span>`}</td>
                    <td>${isSpecial ? `<span class="formula-cell">${formatNumber(ejecutado)}</span>` : `<span onclick="makeCellEditable(event, ${index}, 'ejecutado_acumulado')" class="editable-cell">${formatNumber(ejecutado)}</span>`}</td>
                    <td id="pct_${index}">${pct}%</td>
                    ${monthHTML}
                    <td class="actions-col">
                        ${!isSpecial ? `<button class="action-btn delete-btn" onclick="deleteRow(${index})"><i class="fas fa-trash"></i></button>` : ''}
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateSummary() {
            let totalP = 0, totalE = 0;
            budgetData.forEach(item => {
                if (item.id === 'TOTAL AÑO') return;
                totalP += parseFormattedNumber(item.asignacion);
                totalE += parseFormattedNumber(item.ejecutado_acumulado);
            });

            document.getElementById('totalPresupuesto').textContent = '$' + formatNumber(totalP);
            document.getElementById('totalEmpresa').textContent = '$' + formatNumber(totalE);
            document.getElementById('totalArl').textContent = (totalP > 0 ? ((totalE / totalP) * 100) : 0).toFixed(2) + '%';
            document.getElementById('saldoDisponible').textContent = '$' + formatNumber(totalP - totalE);
        }

        function addNewRow() {
            budgetData.push({
                detalle: "Nueva Partida", asignacion: 0, ejecutado_acumulado: 0,
                enero: 0, febrero: 0, marzo: 0, abril: 0, mayo: 0, junio: 0,
                julio: 0, agosto: 0, septiembre: 0, octubre: 0, noviembre: 0, diciembre: 0
            });
            renderBudgetTable();
            markPendingChanges();
        }

        function deleteRow(index) {
            if (confirm('¿Eliminar este ítem?')) {
                budgetData.splice(index, 1);
                renderBudgetTable();
                updateSummary();
                markPendingChanges();
            }
        }

        function makeCellEditable(event, index, prop) {
            const span = event.target;
            const numeric = parseFormattedNumber(budgetData[index][prop]);
            const input = document.createElement('input');
            input.type = 'number';
            input.value = numeric;
            input.className = 'editable-cell-input';
            
            const cell = span.parentNode;
            cell.replaceChild(input, span);
            input.focus();
            input.select();

            input.onblur = () => {
                const newValue = parseFloat(input.value) || 0;
                budgetData[index][prop] = newValue;

                // Recalcular acumulado si es mes
                const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
                if (months.includes(prop)) {
                    let sum = 0;
                    months.forEach(m => sum += parseFormattedNumber(budgetData[index][m]));
                    budgetData[index].ejecutado_acumulado = sum;
                }

                renderBudgetTable();
                updateSummary();
                markPendingChanges();
            };
            input.onkeydown = (e) => { if(e.key === 'Enter') input.blur(); };
        }

        function saveChanges() {
            if (!hasPendingChanges) return showNotification('No hay cambios', 'info');
            
            // Convertir todo a número antes de enviar
            const dataToSave = budgetData.map(item => {
                const newItem = { ...item };
                for (const k in newItem) {
                    if (k !== 'id' && k !== 'detalle' && typeof newItem[k] === 'string') {
                        newItem[k] = parseFormattedNumber(newItem[k]);
                    }
                }
                return newItem;
            });

            window.parent.postMessage({
                action: 'saveBudgetChanges',
                file: currentFile,
                data: dataToSave
            }, '*');
        }

        function showNotification(msg, type = 'success') {
            const el = document.getElementById('notification');
            el.querySelector('.notification-message').textContent = msg;
            el.className = `k-toast ${type} show`;
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showLoading() {
            document.getElementById('budgetTableBody').innerHTML = '<tr><td colspan="18"><div class="spinner"></div></td></tr>';
        }
    </script>
</body>
</html>
