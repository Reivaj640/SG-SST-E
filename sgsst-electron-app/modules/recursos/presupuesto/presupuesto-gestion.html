<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Presupuesto - K+AIR</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* =========================================
           SISTEMA VISUAL K+AIR (CORE)
           ========================================= */
        :root {
            --k-primary: #174ea6;
            --k-primary-hover: #185abd;
            --k-primary-light: rgba(23, 78, 166, 0.1);
            --k-success: #28a745;
            --k-warning: #ffc107;
            --k-danger: #dc3545;
            --k-bg-app: #f8f9fa;
            --k-bg-card: #ffffff;
            --k-border: #dee2e6;
            --k-text-main: #212529;
            --k-text-muted: #6c757d;
            --k-radius-md: 0.375rem;
            --k-radius-lg: 0.5rem;
            --k-shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
            --k-header-height: 60px;
            --k-font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--k-font-family);
            background-color: var(--k-bg-app);
            color: var(--k-text-main);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

/* =========================================
HEADER ACTION BUTTONS
========================================= */
.header-back-btn {
  padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8125rem;
  font-weight: 500; cursor: pointer; display: inline-flex; align-items: center;
  gap: 0.375rem; border: 1px solid var(--k-border); background-color: #f8f9fa;
  color: var(--k-text-muted); transition: all 0.2s; white-space: nowrap;
  font-family: var(--k-font-family);
}
.header-back-btn:hover {
  background-color: #e2e8f0; color: var(--k-primary); border-color: var(--k-primary);
}
.header-action--primary {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.5rem 1rem; font-size: 0.8125rem; font-weight: 500;
  color: #fff; background: var(--k-primary); border: 1px solid var(--k-primary);
  border-radius: 0.5rem; cursor: pointer; transition: background 0.15s ease;
  font-family: var(--k-font-family); white-space: nowrap;
}
.header-action--primary:hover { background: var(--k-primary-hover); }
.header-action--success {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.5rem 1rem; font-size: 0.8125rem; font-weight: 500;
  color: #fff; background: var(--k-success); border: 1px solid var(--k-success);
  border-radius: 0.5rem; cursor: pointer; transition: background 0.15s ease;
  font-family: var(--k-font-family); white-space: nowrap;
}
.header-action--success:hover { background: #218838; }
.header-action--info {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.5rem 1rem; font-size: 0.8125rem; font-weight: 500;
  color: white; background: #17a2b8; border: 1px solid #17a2b8;
  border-radius: 0.5rem; cursor: pointer; transition: all 0.2s;
  font-family: var(--k-font-family); white-space: nowrap;
}
.header-action--info:hover { background: #138496; border-color: #117a8b; }

/* 📦708 (Fase 3.5) — Botones del modal "Info BD" */
.bd-modal-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 0.85rem; font-size: 0.8rem; font-weight: 500;
  border-radius: 0.4rem; cursor: pointer; transition: all 0.2s;
  font-family: var(--k-font-family); white-space: nowrap;
  border: 1px solid transparent;
}
.bd-modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.bd-modal-btn-primary { background: var(--k-primary); color: white; }
.bd-modal-btn-primary:hover { background: var(--k-primary-hover); }
.bd-modal-btn-secondary { background: white; color: var(--k-primary); border-color: var(--k-primary); }
.bd-modal-btn-secondary:hover { background: var(--k-primary-light); }
.bd-modal-btn-warning { background: white; color: var(--k-warning); border-color: var(--k-warning); }
.bd-modal-btn-warning:hover { background: #fff3cd; }
.bd-modal-btn-danger { background: white; color: var(--k-danger); border-color: var(--k-danger); }
.bd-modal-btn-danger:hover { background: #f8d7da; }

        /* BOTONES */
        .k-btn {
            border: 1px solid var(--k-border); background: white;
            color: var(--k-text-main); padding: 0.5rem 1rem;
            border-radius: var(--k-radius-md); font-size: 0.9rem; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
            transition: all 0.2s;
        }
        .k-btn:hover { background: #f8f9fa; border-color: var(--k-text-muted); }

        .k-btn-primary { background: var(--k-primary); color: white; border-color: var(--k-primary); }
        .k-btn-primary:hover { background: var(--k-primary-hover); }

        .k-btn-success { background: var(--k-success); color: white; border-color: var(--k-success); }
        .k-btn-success:hover { background: #218838; }

/* CONTENIDO PRINCIPAL */
.content-wrapper {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; padding: 1.5rem; gap: 0;
  background: var(--k-bg-app);
}

/* STATS RIBBON — Patrón Canónico K+AIR */
.k-stats-ribbon {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--k-bg-card);
  border: 1px solid var(--k-border);
  border-radius: var(--k-radius-lg);
  padding: 0;
  margin-bottom: 1.5rem;
  box-shadow: var(--k-shadow-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.k-stats-ribbon__item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  flex: 1;
  min-width: 0;
}
.k-stats-ribbon__icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.k-stats-ribbon__icon.primary { background: #e8f0fe; color: #174ea6; }
.k-stats-ribbon__icon.warning { background: #fff3cd; color: #856404; }
.k-stats-ribbon__icon.success { background: #d4edda; color: #28a745; }
.k-stats-ribbon__icon.muted  { background: #f0f2f5; color: #6c757d; }
.k-stats-ribbon__data {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.k-stats-ribbon__value {
  font-family: 'Lexend', 'Segoe UI', sans-serif;
  font-size: 1.375rem;
  font-weight: 700;
  color: var(--k-text-main);
  line-height: 1.2;
}
.k-stats-ribbon__label {
  font-size: 0.6875rem;
  color: var(--k-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.k-stats-ribbon__divider {
  width: 1px;
  height: 36px;
  background: #e5e7eb;
  flex-shrink: 0;
}
.k-section-card {
  background: var(--k-bg-card);
  border: 1px solid var(--k-border);
  border-radius: var(--k-radius-lg);
  box-shadow: var(--k-shadow-sm);
  overflow: hidden;
}
.k-section-card--grow {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* TABLA STICKY */
.table-wrapper {
  flex: 1; overflow: auto;
  position: relative;
}

        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; table-layout: fixed; }

        thead th {
            background: #f8f9fa; position: sticky; top: 0; z-index: 10;
            padding: 1rem; text-align: left; font-weight: 600; color: var(--k-text-muted);
            border-bottom: 2px solid var(--k-border); white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); /* Sombra sutil para separar header */
        }

        tbody td {
            padding: 0.75rem 1rem; border-bottom: 1px solid var(--k-border);
            vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Especificar estilo diferente para la columna de Concepto/Detalle */
        tbody td:nth-child(2) { /* Columna de Concepto/Detalle */
            white-space: normal; /* Permitir saltos de línea */
            overflow: visible; /* Mostrar todo el contenido */
            text-overflow: clip; /* No truncar el texto */
            max-width: 250px; /* Ancho máximo razonable */
            min-width: 200px; /* Ancho mínimo para legibilidad */
            word-break: break-word; /* Romper palabras largas si es necesario */
        }

        tbody tr:hover { background-color: rgba(23, 78, 166, 0.03); }

        /* INPUTS EDITABLES */
        .editable-cell-input {
            width: 100%; padding: 0.4rem 0.6rem;
            border: 1px solid transparent; border-radius: 4px; background: transparent;
            font-family: inherit; font-size: inherit; color: inherit;
            transition: all 0.2s;
        }
        .editable-cell-input:hover { background: #f1f3f4; }
        .editable-cell-input:focus {
            background: white; border-color: var(--k-primary);
            outline: none; box-shadow: 0 0 0 2px var(--k-primary-light);
        }

        /* Estilos para Celdas Editables */
        .editable-cell {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: block;
            min-height: 1.5em;
        }

        .editable-cell:hover {
            background-color: #f0f0f0;
            color: var(--k-primary);
        }

        .formula-cell {
            color: #777;
            background-color: #f4f4f4;
            cursor: not-allowed;
            display: block;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* ACTIONS COLUMN */
        .actions-col { width: 100px; text-align: center; }
        .action-btn {
            color: var(--k-text-muted); cursor: pointer; margin: 0 0.4rem; font-size: 1rem;
            transition: color 0.2s; background: none; border: none; padding: 0.25rem;
        }
        .action-btn:hover { color: var(--k-primary); transform: scale(1.1); }
        .action-btn.delete-btn:hover { color: var(--k-danger); }

        /* NOTIFICACIÓN — 📦653 — Removido CSS viejo (.k-toast) y HTML (#notification).
           Ahora se usa window.KAIRToast.show() de assets/js/kair-toast.js (sistema moderno unificado). */

        /* SPINNER */
        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(23,78,166,0.2);
            border-top-color: var(--k-primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

/* RESPONSIVE */
@media (max-width: 768px) {
  .k-stats-ribbon { flex-wrap: wrap; }
  .k-stats-ribbon__item { flex: 1 1 45%; }
  .k-stats-ribbon__divider { display: none; }
  .k-section-card[style*="flex"] { flex-wrap: wrap; }
  .header-back-btn, .header-action--primary, .header-action--success { font-size: 0.75rem; padding: 0.375rem 0.75rem; }
}

    </style>
</head>
<body>

<div class="content-wrapper">

<!-- HEADER — Card independiente -->
<div class="k-section-card" style="display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.25rem 1.5rem; margin-bottom:1.5rem; flex-shrink:0; flex-grow:0;">
  <div style="display:flex; align-items:center; gap:0.75rem;">
    <i class="fas fa-coins" style="color:#174ea6; font-size:1.25rem;"></i>
    <div>
      <h3 id="moduleTitle" style="font-size:1.125rem; font-weight:600; margin:0; color:#1E293B;">Gestión Presupuestal</h3>

      <span id="header-company-text">—</span>

<!-- TABLA -->

    <!-- 📦653 — Cargar sistema moderno de notificaciones (kair-toast.js) en el iframe
         para que window.KAIRToast.show() esté disponible. El script también se carga
         en el parent (index.html), pero KAIRToast es una clase que se autoinstancia
         al final, así que no hay conflicto. -->
    <script src="../../../assets/js/kair-toast.js"></script>

    <script>
        let budgetData = [];
        let calculationData = [];
        let currentFile = null;
        let formulaCells = [];
        let hasPendingChanges = false;

        // 📦708 (Fase 3.5) — Helpers para acceder a KairConfirm/KAIRToast del parent.
        // KairConfirm y KAIRToast se crean en el parent (index.html). El iframe
        // los accede via window.parent.* — los objetos renderizan en el DOM del parent.
        function _confirmDialog() {
            return (window.parent && window.parent.KairConfirm) ? window.parent.KairConfirm : window.KairConfirm;
        }
        function _showToast(message, type) {
            var t = (window.parent && window.parent.KAIRToast) ? window.parent.KAIRToast : window.KAIRToast;
            if (t) t.show(message, type || 'info');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();

            // Mensajes del padre
  window.addEventListener('message', async (event) => {
    if (event.source !== parent) return;

    if (event.data.company) {
      const el = document.getElementById('header-company-text');
      if (el) el.textContent = event.data.company;
    }

    if (event.data.file) {
                    currentFile = event.data.file;
                    updateFileInfo();
                    await loadData();
                } else if (event.data.budgetData) {
                    budgetData = event.data.budgetData;
                    calculationData = event.data.calculationData || budgetData;
                    if (event.data.formulaCells) formulaCells = event.data.formulaCells;
                    renderBudgetTable();
                    updateSummary();
                    markNoPendingChanges();
                }

                if (event.data.action === 'saveComplete' || (event.data.action === 'saveBudgetChanges' && event.data.success)) {
                    // 📦653 — Usar sistema moderno unificado (assets/js/kair-toast.js)
                    window.KAIRToast.show('Cambios guardados exitosamente', 'success');
                    markNoPendingChanges();
                } else if (event.data.action === 'saveError' || (event.data.action === 'saveBudgetChanges' && !event.data.success)) {
                    window.KAIRToast.show(`Error al guardar: ${event.data.error || 'Error desconocido'}`, 'error');
                }
            });
        });

function setupEventListeners() {
  // 📦708 (Fase 3.5) — Modernizado: usa KairConfirm (estilo 6.1.2)
  const backToSelector = async () => {
    if (!hasPendingChanges) {
      window.parent.postMessage({ action: 'backToHome' }, '*');
      return;
    }
    const confirmed = await _confirmDialog().confirm({
      title: '⚠️ Cambios sin guardar',
      message: 'Tenés cambios sin guardar en este presupuesto.',
      details: 'Si salís ahora vas a perder los cambios. ¿Querés salir de todos modos?',
      confirmText: 'Salir sin guardar',
      cancelText: 'Seguir editando',
      type: 'warning'
    });
    if (confirmed) {
      window.parent.postMessage({ action: 'backToHome' }, '*');
    }
  };

  document.getElementById('backToSelectorBtn').addEventListener('click', backToSelector);
  document.getElementById('bdInfoBtn').addEventListener('click', openBDInfoModal);
  document.getElementById('addRowBtn').addEventListener('click', addNewRow);
  document.getElementById('saveBtn').addEventListener('click', saveChanges);
        }

function updateFileInfo() {
  if (!currentFile) return;
  const year = extractYearFromFileName(currentFile.name);
  const titleEl = document.getElementById('moduleTitle');
  if (titleEl) {
    // 📦708 (Fase 3) — Mostrar indicador de fuente (BD vs Excel)
    const fuente = (currentFile.source === 'BD') ? '📦 BD' : '📄 Excel';
    titleEl.textContent = `Presupuesto ${year} (${fuente})`;
  }
}

        function extractYearFromFileName(fileName) {
            const yearMatch = fileName.match(/(20\d{2})/);
            return yearMatch ? yearMatch[1] : 'Desconocido';
        }

        async function loadData() {
            try {
                showLoading();
                // 📦708 (Fase 3) — Rutear a BD o Excel según la fuente
                if (currentFile && currentFile.source === 'BD') {
                    window.parent.postMessage({
                        action: 'requestBudgetFromDB',
                        presupuestoId: currentFile.presupuestoId
                    }, '*');
                } else {
                    window.parent.postMessage({ action: 'requestBudgetData', file: currentFile }, '*');
                }
            } catch (error) {
                console.error('Error al cargar datos:', error);
                // 📦653 — Usar sistema moderno unificado
                window.KAIRToast.show(`Error al cargar datos: ${error.message}`, 'error');
            }
        }

        function getCellAddress(rowIndex, propertyName) {
            const row = rowIndex + 10;
            const columnMap = {
                'id': 'A', 'detalle': 'C', 'asignacion': 'D', 'ejecutado_acumulado': 'E',
                'porcentaje_ejecutado': 'F', 'enero': 'G', 'febrero': 'H', 'marzo': 'I',
                'abril': 'J', 'mayo': 'K', 'junio': 'L', 'julio': 'M', 'agosto': 'N',
                'septiembre': 'O', 'octubre': 'P', 'noviembre': 'Q', 'diciembre': 'R'
            };
            const col = columnMap[propertyName];
            return col ? `${col}${row}` : null;
        }

        function markPendingChanges() {
            hasPendingChanges = true;
            const btn = document.getElementById('saveBtn');
            btn.classList.add('k-btn-primary');
            btn.classList.remove('k-btn-success');
            btn.innerHTML = '<i class="fas fa-save"></i> Guardar (Pendiente)';
        }

        function markNoPendingChanges() {
            hasPendingChanges = false;
            const btn = document.getElementById('saveBtn');
            btn.classList.remove('k-btn-primary');
            btn.classList.add('k-btn-success');
            btn.innerHTML = '<i class="fas fa-save"></i> Guardar Cambios';
        }

function parseFormattedNumber(value) {
    if (value === null || value === undefined || value === '') return 0;
    if (typeof value === 'number') return value;
    let clean = value.toString()
        .replace(/\$/g, '')
        .replace(/\s/g, '')
        .replace(/\./g, '')
        .replace(/,/g, '.');
    const parsed = parseFloat(clean);
    return isNaN(parsed) ? 0 : parsed;
  }

        // 📦653 — Formato inteligente: muestra decimales SOLO si el número los tiene.
        // Antes: "0" se mostraba como "0,00", "100" como "100,00" → ocupaban espacio innecesario.
        // Ahora: "0" → "0", "100" → "100", "50,5" → "50,5", "1234,56" → "1.234,56".
        function formatNumber(num) {
            if (num === null || num === undefined || num === '') return '0';
            const numberValue = isNaN(parseFloat(num)) ? 0 : parseFloat(num);
            // Entero → sin decimales
            if (Number.isInteger(numberValue)) {
                return numberValue.toLocaleString('es-CO', { maximumFractionDigits: 0 });
            }
            // Con decimales → 2 dígitos (es-CO usa coma decimal)
            return numberValue.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // 📦653 — Igual que formatNumber pero con sufijo % y respetando 2 decimales cuando los hay.
        function formatPct(num) {
            if (num === null || num === undefined || isNaN(parseFloat(num))) return '0%';
            const numberValue = parseFloat(num);
            if (Number.isInteger(numberValue)) {
                return numberValue.toLocaleString('es-CO', { maximumFractionDigits: 0 }) + '%';
            }
            return numberValue.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
        }

        function renderBudgetTable() {
            const tableBody = document.getElementById('budgetTableBody');
            tableBody.innerHTML = '';
            const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

            budgetData.forEach((item, index) => {
                const row = document.createElement('tr');
                const isSpecial = item.id === 'TOTAL AÑO' || item.id === 'ANALISIS PRESUPUESTAL';

                let monthHTML = '';
                months.forEach(m => {
                    const addr = getCellAddress(index, m);
                    if (formulaCells.includes(addr) || isSpecial) {
                        monthHTML += `<td><span class="formula-cell">${formatNumber(item[m] || 0)}</span></td>`;
                    } else {
                        monthHTML += `<td><span onclick="makeCellEditable(event, ${index}, '${m}')" class="editable-cell">${formatNumber(item[m] || 0)}</span></td>`;
                    }
                });

                const asignacion = parseFormattedNumber(item.asignacion || 0);
                const ejecutado = parseFormattedNumber(item.ejecutado_acumulado || 0);
                // 📦653 — formatPct omite los ,00 cuando el % es entero
                const pct = asignacion > 0 ? (ejecutado / asignacion) * 100 : 0;

                row.innerHTML = `
                    <td>${isSpecial ? item.id : index + 1}</td>
                    <td>${isSpecial ? item.id : item.detalle || '-'}</td>
                    <td>${isSpecial ? `<span class="formula-cell">${formatNumber(asignacion)}</span>` : `<span onclick="makeCellEditable(event, ${index}, 'asignacion')" class="editable-cell">${formatNumber(asignacion)}</span>`}</td>
                    <td>${isSpecial ? `<span class="formula-cell">${formatNumber(ejecutado)}</span>` : `<span onclick="makeCellEditable(event, ${index}, 'ejecutado_acumulado')" class="editable-cell">${formatNumber(ejecutado)}</span>`}</td>
                    <td id="pct_${index}">${formatPct(pct)}</td>
                    ${monthHTML}
                    <td class="actions-col">
                        ${!isSpecial ? `<button class="action-btn delete-btn" onclick="deleteRow(${index})"><i class="fas fa-trash"></i></button>` : ''}
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateSummary() {
            let totalP = 0, totalE = 0;
            budgetData.forEach(item => {
                if (item.id === 'TOTAL AÑO') return;
                totalP += parseFormattedNumber(item.asignacion);
                totalE += parseFormattedNumber(item.ejecutado_acumulado);
            });

            document.getElementById('totalPresupuesto').textContent = '$' + formatNumber(totalP);
            document.getElementById('totalEmpresa').textContent = '$' + formatNumber(totalE);
            // 📦653 — formatPct omite ,00 cuando el % es entero
            document.getElementById('totalArl').textContent = formatPct(totalP > 0 ? (totalE / totalP) * 100 : 0);
            document.getElementById('saldoDisponible').textContent = '$' + formatNumber(totalP - totalE);
        }

        function addNewRow() {
            budgetData.push({
                detalle: "Nueva Partida", asignacion: 0, ejecutado_acumulado: 0,
                enero: 0, febrero: 0, marzo: 0, abril: 0, mayo: 0, junio: 0,
                julio: 0, agosto: 0, septiembre: 0, octubre: 0, noviembre: 0, diciembre: 0
            });
            renderBudgetTable();
            markPendingChanges();

        // 📦708 (Fase 3.5) — Modernizado: usa KairConfirm (estilo 6.1.2)
        async function deleteRow(index) {
            const confirmed = await _confirmDialog().confirm({
                title: '¿Eliminar esta partida?',
                message: 'Vas a eliminar esta partida del presupuesto.',
                details: 'Esta acción se aplica al guardar los cambios. Si querés, podés volver a agregarla después.',
                confirmText: 'Sí, eliminar',
                cancelText: 'Cancelar',
                type: 'warning'
            });
            if (confirmed) {
                budgetData.splice(index, 1);
                renderBudgetTable();
                updateSummary();
                markPendingChanges();
            }
        }

        function makeCellEditable(event, index, prop) {
            const span = event.target;
            const numeric = parseFormattedNumber(budgetData[index][prop]);
            const input = document.createElement('input');
            input.type = 'number';
            input.value = numeric;
            input.className = 'editable-cell-input';

            const cell = span.parentNode;
            cell.replaceChild(input, span);
            input.focus();
            input.select();

            input.onblur = () => {
                const newValue = parseFloat(input.value) || 0;
                budgetData[index][prop] = newValue;

                // Recalcular acumulado si es mes
                const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
                if (months.includes(prop)) {
                    let sum = 0;
                    months.forEach(m => sum += parseFormattedNumber(budgetData[index][m]));
                    budgetData[index].ejecutado_acumulado = sum;
                }

                renderBudgetTable();
                updateSummary();
                markPendingChanges();
            };
            input.onkeydown = (e) => { if(e.key === 'Enter') input.blur(); };
        }

        function saveChanges() {
            // 📦653 — Usar sistema moderno unificado
            if (!hasPendingChanges) return window.KAIRToast.show('No hay cambios', 'info');

            // Convertir todo a número antes de enviar
            const dataToSave = budgetData.map(item => {
                const newItem = { ...item };
                for (const k in newItem) {
                    if (k !== 'id' && k !== 'detalle' && typeof newItem[k] === 'string') {
                        newItem[k] = parseFormattedNumber(newItem[k]);
                    }
                }
                return newItem;
            });

            window.parent.postMessage({
                action: 'saveBudgetChanges',
                source: (currentFile && currentFile.source === 'BD') ? 'BD' : 'EXCEL',
                file: currentFile,
                presupuestoId: currentFile ? currentFile.presupuestoId : null,
                data: dataToSave
            }, '*');

        /**

         */
        async function bdModalAction(action) {
            if (!_bdModalState.presupuesto) {
                _showToast('No hay presupuesto activo en BD', 'warning');
                return;
            }
            var p = _bdModalState.presupuesto;

            if (action === 'viewResumen') {
                // Pide el resumen detallado al parent
                window.parent.postMessage({ action: 'viewBDResumen', anio: p.anio }, '*');
            } else if (action === 'editMeta') {
                var values = await _confirmDialog().input({
                    title: '✏️ Editar presupuesto',
                    message: 'Cambiá el nombre y las notas del presupuesto ' + p.anio + '.',
                    fields: [
                        { key: 'nombre', label: 'Nombre', type: 'text', required: true, value: p.nombre || '', placeholder: 'Ej: Presupuesto SG-SST 2026' },
                        { key: 'notas', label: 'Notas', type: 'textarea', value: p.notas || '', placeholder: 'Notas u observaciones' }
                    ],
                    confirmText: 'Guardar',
                    cancelText: 'Cancelar',
                    type: 'info'
                });
                if (values) {
                    window.parent.postMessage({ action: 'updatePresupuestoMeta', presupuestoId: p.id, nombre: values.nombre, notas: values.notas || null }, '*');
                }
            } else if (action === 'addPartida') {
                var addValues = await _confirmDialog().input({
                    title: '+ Nueva Partida',
                    message: 'Agregá una partida al presupuesto "' + (p.nombre || 'sin nombre') + '" (' + p.anio + ').',

                    ],
                    confirmText: 'Crear partida',
                    cancelText: 'Cancelar',

                });

        function _closeBDInfoModal() {
            var modal = document.getElementById('bd-info-modal');
            if (modal) modal.remove();

        function _escHtml(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // Listener de postMessage para mensajes del modal BD
        // (Los type=bd-* no entran en conflicto con el listener existente
        // que solo procesa company/file/budgetData/saveComplete/saveError)
        window.addEventListener('message', function(event) {
            if (event.source !== window.parent) return;
            var data = event.data;
            if (!data || !data.type) return;
            if (data.type === 'bd-status') {
                _renderBDModalBody(data);
            } else if (data.type === 'bd-meta-updated' || data.type === 'bd-partida-added' || data.type === 'bd-export-result') {
                // Si el modal está abierto, cerrarlo y refrescar (re-abrirlo para ver data actualizada)
                if (document.getElementById('bd-info-modal')) {
                    _closeBDInfoModal();
                    setTimeout(openBDInfoModal, 250);
                }
            } else if (data.type === 'bd-resumen') {
                // El resumen detallado: mostrarlo en un sub-modal con la lista de partidas
                if (data.success && data.data && data.data.presupuesto) {
                    _showBDResumenSubModal(data.data);
                }
            }
        });

                            '<div style="background: #f8f9fa; padding: 0.75rem; border-radius: 6px;">' +
                                '<div style="font-size: 0.65rem; text-transform: uppercase; color: #6c757d;">Saldo</div>' +
                                '<div style="font-size: 1.05rem; font-weight: 700; color: #174ea6;">' + fmt.format(r.saldo) + '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div style="overflow-x: auto;">' +
                            '<table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">' +
                                '<thead>' +
                                    '<tr style="background: #f1f3f5;">' +
                                        '<th style="padding: 0.5rem 0.75rem; text-align: left;">#</th>' +
                                        '<th style="padding: 0.5rem 0.75rem; text-align: left;">Concepto</th>' +
                                        '<th style="padding: 0.5rem 0.75rem; text-align: right;">Asignado</th>' +
                                        '<th style="padding: 0.5rem 0.75rem; text-align: right;">% Ejec.</th>' +
                                        '<th style="padding: 0.5rem 0.75rem; text-align: center;">Acciones</th>' +
                                    '</tr>' +
                                '</thead>' +
                                '<tbody>' + rows + '</tbody>' +
                            '</table>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            document.body.appendChild(overlay);
            document.getElementById('bd-resumen-close').onclick = function() { overlay.remove(); };
            overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
        }

        /**
         * Confirma y elimina (soft delete) una partida desde el sub-modal de resumen
         */
        async function bdModalEliminarPartida(partidaId, label) {
            if (!_bdModalState.presupuesto) return;
            var display = label || ('partida #' + partidaId);
            var confirmed = await _confirmDialog().confirm({
                title: '¿Eliminar partida?',
                message: 'Vas a eliminar la partida "' + display + '" del presupuesto ' + _bdModalState.presupuesto.anio + '.',
                details: 'Esto hace un soft delete (la partida queda con activo=0 pero se preserva para histórico).',
                confirmText: 'Sí, eliminar',
                cancelText: 'Cancelar',
                type: 'warning'
            });
            if (confirmed) {
                window.parent.postMessage({ action: 'deletePartidaFromBD', partidaId: partidaId }, '*');
            }
        }
    </script>
</body>
