<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Archivos - K+AIR</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 🎨 PREMIUM v1 — Design system compartido K+AIR -->
    <link rel="stylesheet" href="../../../shared/kair-design-tokens.css">
    <link rel="stylesheet" href="../../../shared/kair-components.css">
    
    <style>
        /* =========================================
           SISTEMA VISUAL K+AIR (CORE)
           ========================================= */
        :root {
            --k-primary: #174ea6;
            --k-primary-hover: #185abd;
            --k-primary-light: rgba(23, 78, 166, 0.08);
            --k-success: #28a745;
            --k-warning: #ffc107;
            --k-danger: #dc3545;
            --k-bg-app: #f8f9fa;
            --k-bg-card: #ffffff;
            --k-border: #dee2e6;
            --k-text-main: #212529;
            --k-text-muted: #6c757d;
            --k-radius-md: 0.375rem;
            --k-radius-lg: 0.5rem;
            --k-shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
            --k-shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
            --k-header-height: 60px;
            --k-font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--k-font-family);
            background-color: var(--k-bg-app);
            color: var(--k-text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

/* =========================================
HEADER ACTION BUTTONS
========================================= */
.header-back-btn {
  padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8125rem;
  font-weight: 500; cursor: pointer; display: inline-flex; align-items: center;
  gap: 0.375rem; border: 1px solid var(--k-border); background-color: #f8f9fa;
  color: var(--k-text-muted); transition: all 0.2s; white-space: nowrap;
  font-family: var(--k-font-family);
}
.header-back-btn:hover {
  background-color: #e2e8f0; color: var(--k-primary); border-color: var(--k-primary);
}

/* CARD CONTAINER */
.k-section-card {
  background: var(--k-bg-card);
  border: 1px solid var(--k-border);
  border-radius: var(--k-radius-lg);
  box-shadow: var(--k-shadow-sm);
  overflow: hidden;
}

        /* Contenido Principal */
        .content-area {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Grid de Años
           📦824-wide — Era `repeat(auto-fill, minmax(300px, 1fr))` porque antes
           las cards de período eran hijas directas. Ahora cada hijo (encabezado
           de bloque y panel) ocupa la fila entera con `grid-column: 1/-1`, así
           que una sola columna describe bien el layout y no quedan columnas
           vacías reservadas. */
        .year-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .year-card {
            background: var(--k-bg-card);
            border: 1px solid var(--k-border);
            border-radius: var(--k-radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: var(--k-shadow-sm);
        }

        .year-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--k-shadow-md);
            border-color: var(--k-primary-hover);
        }

        .year-card.selected {
            border: 2px solid var(--k-primary);
            background-color: var(--k-primary-light);
        }

        .year-card.selected .year-icon {
            color: var(--k-primary);
            transform: scale(1.1);
        }

        .year-icon {
            font-size: 2.5rem;
            color: var(--k-text-muted);
            margin-bottom: 1rem;
            transition: transform 0.2s;
            opacity: 0.8;
        }

        .year-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--k-text-main);
        }

        /* Panel de Detalles (Contextual) */
        .file-context-panel {
            background: var(--k-bg-card);
            border: 1px solid var(--k-border);
            border-left: 4px solid var(--k-primary);
            border-radius: var(--k-radius-md);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--k-shadow-sm);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .file-icon-lg {
            font-size: 2rem;
            color: #217346; /* Excel Color */
        }

        .file-data h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .file-data p { margin: 0.25rem 0 0; color: var(--k-text-muted); font-size: 0.85rem; font-family: monospace; }

        .file-actions {
            display: flex;
            gap: 0.75rem;
        }

        .k-btn {
            border: none;
            border-radius: var(--k-radius-md);
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .k-btn-primary { background-color: var(--k-primary); color: white; box-shadow: 0 2px 4px rgba(23,78,166,0.3); }
        .k-btn-primary:hover { background-color: var(--k-primary-hover); transform: translateY(-1px); }

        .k-btn-outline { background: white; border: 1px solid var(--k-border); color: var(--k-text-main); }
        .k-btn-outline:hover { background: #f8f9fa; border-color: var(--k-text-muted); }

        /* Estado Vacío */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--k-text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.2; }

        /* Loading */
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.9);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            flex-direction: column; gap: 1rem;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(23,78,166,0.2);
            border-top-color: var(--k-primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        /* 📦824 — El toast "oculto" asomaba una franja en el borde inferior.
           `translateY(150%)` es un porcentaje de la ALTURA PROPIA del toast, no
           del espacio que hay que bajar: como el toast está a `bottom: 2rem`,
           bajar solo 1.5 alturas lo dejaba a `32px - 0.5*alto` del borde, o sea
           ~4px de franja blanca con su filete azul siempre visibles (en ventana
           ancha, con 2 períodos, quedaba abajo a la derecha). Se corrige
           bajando la altura completa más el margen, y con `opacity: 0` para que
           un toast de varias líneas tampoco pueda asomar. */
        .k-toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: white; padding: 1rem 1.5rem;
            border-radius: var(--k-radius-lg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            display: flex; align-items: center; gap: 0.75rem;
            transform: translateY(calc(100% + 2rem)); opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
            z-index: 2000; border-left: 4px solid var(--k-primary); font-weight: 500;
        }
        .k-toast.show { transform: translateY(0); opacity: 1; }
        .k-toast.success { border-left-color: var(--k-success); }
        .k-toast.error { border-left-color: var(--k-danger); }

        /* ═══════════════════════════════════════════════════════════
           PREMIUM v1 (2026-09-15) — Header sin tarjeta, breadcrumb,
           tarjetas de año y panel de archivo con acabado premium
           (patrón aprobado en Capacitación).
           ═══════════════════════════════════════════════════════════ */
        body { background: var(--kair-canvas, #fbfcfb); }
        /* 📦824-wide — La columna ocupa todo el ancho de la ventana. Estaba
           topeada a 1400px y centrada, así que en pantallas anchas quedaban
           ~280px de lienzo vacío a cada lado. Los grids de abajo usan `auto-fit`
           y no `auto-fill`: `auto-fill` reserva columnas vacías, y con 2
           períodos cargados el hueco reaparecía DENTRO del recuadro — el mismo
           vacío, solo que mudado de lugar. */
        .content-area { max-width: none; gap: clamp(18px, 2vw, 28px); }

        .pres-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .pres-header__left { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
        .pres-header__icon { width: 44px; height: 44px; border-radius: 12px; background: #e3ecfb; color: var(--kair-blue, #2057b8); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .pres-header__crumb { font-size: 11px; color: var(--kair-faint, #aab1bd); margin-bottom: 3px; }
        .pres-header__crumb span { padding: 0 4px; }
        .pres-header__title { margin: 0; font: 800 clamp(17px, 1.7vw, 23px)/1.15 var(--kair-font-display, 'Segoe UI'); letter-spacing: -0.03em; color: var(--kair-ink, #14213d); }
        .pres-header__sub { font-size: 0.8125rem; color: var(--kair-muted, #748096); margin: 2px 0 0 0; }
        .pres-header__right { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .pres-header__company { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 600; color: var(--kair-muted, #748096); background: var(--kair-soft, #f3f6f6); border-radius: 999px; padding: 0.35rem 0.8rem; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-back-btn { padding: 0.55rem 1rem; border-radius: 10px; font-size: 0.8125rem; font-weight: 600; border: 1px solid var(--kair-line, #e8ebee); background: #fff; color: #536177; }
        .header-back-btn:hover { background: var(--kair-soft, #f3f6f6); color: var(--kair-blue, #2057b8); }

        /* Tarjetas de año — premium */
        .year-grid { gap: clamp(12px, 1.3vw, 18px); }
        .year-card {
            border: 1px solid var(--kair-line, #e8ebee); border-radius: var(--kair-radius-card, 20px);
            box-shadow: 0 2px 7px rgba(37, 56, 82, 0.04); background: var(--kair-card, #fff);
        }
        .year-card:hover { border-color: #c8d7ef; box-shadow: 0 10px 24px rgba(28, 49, 92, 0.08); transform: translateY(-3px); }
        .year-card.selected { border: 2px solid var(--kair-blue, #2057b8); background: #eef4fd; }
        .year-icon { color: var(--kair-blue, #2057b8); opacity: 1; }
        .year-number { font-family: var(--kair-font-display, 'Segoe UI'); letter-spacing: -0.03em; }

        /* ══════════════════════════════════════════════════════════════
           📦824-modern — Premium v2: selección de período.
           Mismo lenguaje visual del home del módulo (main-action-card
           gradient 135°, pres-home__pill y las progress bars de las metric
           cards de Gestión Humana). La diferencia clave con la v1: el %
           de ejecución deja de ser un número suelto y pasa a barra.

           Este bloque REEMPLAZA al diseño v1 de las cards (`.year-meta*`,
           `.year-stats`, `.year-btn*`, `.year-card--pendiente`,
           `.selector-section-title`), que quedó sin uso y se eliminó: un
           selector de estilos muerto engaña a quien lea el archivo después
           (y arrastraba una referencia colgante a `--kair-warning`, token
           que NO existe en kair-design-tokens.css — el color de aviso real
           es `--kair-amber-text`).
           ══════════════════════════════════════════════════════════════ */

        /* — Encabezado de sección: chip + título + contador a la derecha —
           📦824-wide — El chip, el texto, el título y la bajada ya no se
           definen acá: son `.kair-block__chip/__text/__title/__sub` de
           `shared/kair-components.css`, los mismos que usa el home. Lo único
           propio del selector es el `grid-column` (el encabezado ocupa la fila
           entera del grid) y el contador de la derecha. */
        .sel-section { grid-column: 1 / -1; }
        .sel-section__chip--drive { background: var(--kair-soft, #f3f6f6); color: var(--kair-muted, #748096); }
        .sel-section__chip--warn { background: var(--kair-amber-soft, #fbf0db); color: var(--kair-amber-text, #b07c1a); }
        .sel-section__count {
            margin-left: auto; flex-shrink: 0;
            font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
            padding: 5px 11px; border-radius: 999px; white-space: nowrap;
            background: var(--kair-soft, #f3f6f6); color: var(--kair-muted, #748096);
        }
        .sel-section__count--bd { background: var(--kair-blue-soft, #eaf1fb); color: var(--kair-blue-text, #2057b8); }
        .sel-section__count--warn { background: var(--kair-amber-soft, #fbf0db); color: var(--kair-amber-text, #b07c1a); }

        /* — Card de período en BD — */
        .year-card--bd {
            border: 1px solid var(--kair-line, #e8ebee);
            border-radius: var(--kair-radius-card, 20px);
            box-shadow: var(--kair-shadow-card, 0 2px 7px rgba(37, 56, 82, 0.08));
            background: var(--kair-card, #fff);
            padding: 20px 22px 18px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            /* La card base centra sus hijos (`align-items: center`), y con el
               contenido justo de ancho eso no se notaba. Al ensancharse, cada
               bloque se encogía a su contenido y todo quedaba amontonado en el
               centro en vez de repartir la card. `stretch` devuelve el control
               al ancho real de la card. */
            align-items: stretch;
            justify-content: flex-start;
        }
        /* Sin filete de acento: se probó el ::before con gradient de 3px (el
           recurso de la card .primary del home) y en una card con tantas cifras
           cortaba la lectura — el peso visual lo aporta el año en display y la
           barra de ejecución, no una línea decorativa. */
        .year-card--bd:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(28, 49, 92, 0.10);
            border-color: #c8d7ef;
        }

        .pdb__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .pdb__year {
            font: 800 clamp(26px, 2.4vw, 34px)/1 var(--kair-font-display, 'Manrope');
            letter-spacing: -0.045em; color: var(--kair-ink, #14213d);
            font-variant-numeric: tabular-nums;
        }
        .pdb__pill {
            font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            padding: 5px 10px; border-radius: 999px; white-space: nowrap;
            background: var(--kair-blue-soft, #eaf1fb); color: var(--kair-blue-text, #2057b8);
        }
        .pdb__pill--warn { background: var(--kair-amber-soft, #fbf0db); color: var(--kair-amber-text, #b07c1a); }

        /* 📦824-wide — Cuerpo en dos zonas que se reacomodan solas, sin media
           query. En una card angosta (4+ años en pantalla) NO cabe una zona al
           lado de la otra y se apilan, igual que antes; cuando sobra ancho (pocos
           períodos, ventana grande) las cifras quedan a la izquierda y la
           ejecución + acciones a la derecha, en vez de estirar un solo bloque a
           lo largo y dejar la card descompensada. */
        .pdb__body { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
        .pdb__figs { flex: 1 1 260px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 0; }
        .pdb__side { flex: 1 1 240px; min-width: 220px; display: flex; flex-direction: column; }
        .pdb__fig {
            background: var(--kair-soft, #f3f6f6); border-radius: 12px; padding: 10px 12px; min-width: 0;
            /* Contenido centrado en la vertical: en una card angosta el alto es
               justo el del contenido y no cambia nada; en una ancha, donde la
               zona de la derecha es más alta, el tile deja de verse medio vacío. */
            display: flex; flex-direction: column; justify-content: center;
        }
        .pdb__fig-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--kair-muted, #748096);
        }
        .pdb__fig-value {
            margin-top: 3px; font: 700 clamp(14px, 1.25vw, 17px)/1.15 var(--kair-font-display, 'Manrope');
            letter-spacing: -0.025em; color: var(--kair-ink, #14213d);
            font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Barra de ejecución — patrón de las metric cards de Gestión Humana.
           `flex: 1` + centrado: dentro de la zona derecha ocupa la altura que
           sobre y deja la barra alineada con el centro de las cifras. */
        .pdb__exec { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .pdb__exec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .pdb__exec-label { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; font-size: 10px; color: var(--kair-muted, #748096); }
        .pdb__exec-value { font: 800 clamp(15px, 1.35vw, 19px)/1 var(--kair-font-display, 'Manrope'); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
        .pdb__bar { margin-top: 7px; height: 7px; border-radius: 999px; background: var(--kair-soft, #f3f6f6); overflow: hidden; }
        .pdb__bar-fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
        .pdb__bar-fill--ok { background: linear-gradient(90deg, #1bb888 0%, #16a37b 100%); }
        .pdb__bar-fill--warn { background: linear-gradient(90deg, #e7a224 0%, #c9890f 100%); }
        .pdb__bar-fill--over { background: linear-gradient(90deg, #d0453c 0%, #a52f28 100%); }

        /* Chips informativos */
        .pdb__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .pdb__chip {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
            background: var(--kair-soft, #f3f6f6); color: var(--kair-muted, #748096);
        }
        .pdb__chip--warn { background: var(--kair-amber-soft, #fbf0db); color: var(--kair-amber-text, #b07c1a); }
        .pdb__chip i { font-size: 0.68rem; }

        .pdb__actions { display: flex; gap: 8px; margin-top: 16px; }
        .pdb__btn {
            flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            padding: 10px 14px; border-radius: var(--kair-radius-control, 12px);
            font: 700 0.83rem var(--kair-font-ui, 'DM Sans'); cursor: pointer;
            border: 1px solid var(--kair-line, #e8ebee);
            background: #fff; color: var(--kair-ink, #14213d);
            transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
        }
        .pdb__btn:hover { background: var(--kair-soft, #f3f6f6); }
        .pdb__btn:active { transform: scale(0.98); }
        .pdb__btn--primary {
            background: linear-gradient(135deg, var(--kair-blue, #2057b8) 0%, var(--kair-blue-ink, #172c4c) 100%);
            border-color: transparent; color: #fff;
            box-shadow: var(--kair-shadow-soft, 0 8px 18px rgba(32, 87, 184, 0.15));
        }
        .pdb__btn--primary:hover { background: linear-gradient(135deg, #1a4ba0 0%, #12233f 100%); }
        .pdb__btn--icon { flex: 0 0 auto; padding: 10px 13px; }

        /* — Marco contenedor de cada bloque —
           📦824-wide — Los períodos cargados y los años de Drive son dos
           bloques hermanos y ambos van dentro de un marco, para que la
           pantalla se lea igual que el home.

           El marco (fondo, borde, radio, sombra, padding) y el grid base ya
           no se definen acá: vienen de `shared/kair-components.css`
           (`.kair-block__panel` + `.kair-block__grid`), los mismos que usa el home.
           Antes el selector traía su propia copia y el home otra: dos medidas
           para el mismo marco, que es justo como se rompe la homogeneidad
           entre pantallas.

           Lo que sí es propio del selector queda aquí: `grid-column` (cada
           bloque ocupa la fila entera) y el `minmax` de cada grid, porque una
           card de período y un tile de Drive no usan el mismo piso de ancho.
           Y el contenedor NO rediseña la card: `.year-card--bd` conserva su
           padding, tipografía, cifras y barra tal cual. */
        .sel-bd,
        .sel-drive {
            grid-column: 1 / -1;
        }
        .sel-bd__grid { margin-top: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        /* Años de Drive: tiles compactos agrupados, no 6 cards repetidas. */
        .sel-drive__grid { margin-top: 14px; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }
        .sel-tile {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 12px; border-radius: var(--kair-radius-control, 12px);
            background: var(--kair-soft, #f3f6f6); border: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s, transform 0.12s;
        }
        .sel-tile:hover { background: #fff; border-color: #c8d7ef; transform: translateY(-2px); }
        .sel-tile__icon {
            width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #fff; color: #1bb888; font-size: 0.95rem;
        }
        .sel-tile__text { min-width: 0; flex: 1; }
        .sel-tile__year { font: 800 0.98rem/1.1 var(--kair-font-display, 'Manrope'); letter-spacing: -0.02em; color: var(--kair-ink, #14213d); font-variant-numeric: tabular-nums; }
        .sel-tile__file { font-size: 10.5px; color: var(--kair-muted, #748096); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sel-tile__btn {
            flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; font-size: 0.82rem;
            background: var(--kair-blue, #2057b8); color: #fff;
            transition: transform 0.12s, background 0.15s, box-shadow 0.15s;
        }
        .sel-tile__btn:hover { background: #17408a; box-shadow: 0 6px 14px rgba(32, 87, 184, 0.28); }
        .sel-tile__btn:active { transform: scale(0.94); }

        /* Panel de archivo — premium */
        .file-context-panel {
            border: 1px solid var(--kair-line, #e8ebee); border-left: 4px solid var(--kair-blue, #2057b8);
            border-radius: var(--kair-radius-card, 20px); box-shadow: 0 2px 7px rgba(37, 56, 82, 0.05);
        }
        .k-btn-outline { background: #fff; border: 1px solid var(--kair-line, #e8ebee); color: #536177; border-radius: 10px; font-weight: 600; font-size: 0.85rem; }
        .k-btn-outline:hover { background: var(--kair-soft, #f3f6f6); border-color: var(--kair-line, #e8ebee); }
        .k-btn-primary { background: var(--kair-blue, #2057b8); border-radius: 10px; font-weight: 700; font-size: 0.85rem; box-shadow: 0 8px 18px rgba(32, 87, 184, 0.15); }
        .k-btn-primary:hover { background: #1a4ba0; }

        .section-title { font: 700 clamp(14px, 1.3vw, 17px) var(--kair-font-display, 'Segoe UI'); letter-spacing: -0.03em; color: var(--kair-ink, #14213d); margin: 0 0 1rem; }
    </style>
</head>
<body>

<div class="content-area">

<!-- HEADER — Premium: sin tarjeta, breadcrumb + título -->
<div class="pres-header">
  <div class="pres-header__left">
    <div class="pres-header__icon"><i class="fas fa-history"></i></div>
    <div>
      <div class="pres-header__crumb">Recursos<span>/</span>Presupuesto</div>
      <h1 class="pres-header__title">Histórico de Presupuestos</h1>
      <p class="pres-header__sub">Seleccione el año fiscal para gestionar su presupuesto.</p>
    </div>
  </div>
  <div class="pres-header__right">
    <span class="pres-header__company">
      <i class="fas fa-building"></i>
      <span id="header-company-text">—</span>
    </span>
    <button id="backToSubmodulesBtn" class="header-back-btn" title="Volver al inicio">
      <i class="fas fa-arrow-left"></i> Volver
    </button>
  </div>
</div>
        <!-- Grid Container — cada bloque se rotula con su propio encabezado
             premium v2 (chip + título + contador), así que el h3 suelto
             "Seleccione Año Fiscal" solo competía por la jerarquía visual. -->
        <div>
            <div class="year-grid" id="yearOptions">
                <!-- Inyectado por JS -->
            </div>
        </div>

        <!-- Panel de Archivo Seleccionado (Hidden by default) -->
        <div id="fileDetails" class="file-context-panel" style="display: none;">
            <div class="file-info">
                <i class="fas fa-file-excel file-icon-lg"></i>
                <div class="file-data">
                    <h3 id="fileName">presupuesto_2025.xlsx</h3>
                    <p id="filePath">C:/Ruta/Ejemplo/...</p>
                </div>
            </div>
            <div class="file-actions">
                <button id="duplicateFileBtn" class="k-btn k-btn-outline">
                    <i class="fas fa-copy"></i> Clonar Año
                </button>
                <button id="openFileBtn" class="k-btn k-btn-primary">
                    <i class="fas fa-external-link-alt"></i> Gestionar Presupuesto
                </button>
            </div>
        </div>
    </div>

    <!-- UI Elements -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-weight: 500; color: var(--k-primary);">Procesando solicitud...</div>
    </div>

    <div class="k-toast" id="notification">
        <i class="fas fa-check-circle"></i>
        <span class="toast-msg">Mensaje del sistema</span>
    </div>

    <script>
        // 📦824 — Caché de los .xlsx de Drive. La necesita `buscarArchivoDelAnio()`
        // para poder reimportar un período que ya está en la BD.
        let _driveFilesCache = [];

        // 📦708 (Fase 3.5) — Helper para acceder a KairConfirm del parent (modernos)
        function _confirmDialog() {
            return (window.parent && window.parent.KairConfirm) ? window.parent.KairConfirm : window.KairConfirm;
        }

        /**
         * 📦824 — Respuesta del import. Muestra lo que pasó y, si terminó bien,
         * abre el período para que el usuario vea el resultado de una vez.
         */
        function handleImportResponse(res) {
            hideLoading();
            if (!res.success) {
                showNotification('No se pudo importar: ' + ((res.error && res.error.message) || 'error desconocido'), 'error');
                window.parent.postMessage({ action: 'requestBudgetFiles' }, '*');
                return;
            }
            const d = res.data || {};
            const partes = [`${d.inserted || 0} partidas cargadas`, `asignado $${_fmt(d.totalAsignado)}`];
            if (d.totalDeclarado && Math.abs(d.totalDeclarado - d.totalAsignado) > 1) {
                partes.push(`el Excel declara $${_fmt(d.totalDeclarado)}`);
            }
            showNotification('Período ' + (d.anio || '') + ' importado: ' + partes.join(' · '), 'success');

            // ⚠️ Avisos del Excel: se muestran, no se esconden. El caso típico es
            // que la fila TOTAL AÑO del archivo no cuadre con la suma de las
            // partidas; la app usa la suma real, pero hay que decirlo.
            if (Array.isArray(d.avisos) && d.avisos.length) {
                showNotification('Aviso del Excel: ' + d.avisos[0], 'warning', 9000);
            }

            if (d.presupuestoId) {
                window.parent.postMessage({
                    action: 'open-budget-from-db',
                    presupuestoId: d.presupuestoId,
                    anio: d.anio
                }, '*');
            } else {
                window.parent.postMessage({ action: 'requestBudgetFiles' }, '*');
            }
        }

        // Lógica de Renderizado y Eventos (Conecta con tu JS existente)
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ [UI Selector] Inicializado. Esperando datos...');

            // Listeners globales
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;

    if (event.data.company) {
      const el = document.getElementById('header-company-text');
      if (el) el.textContent = event.data.company;
    }

    // 📦824 — Llega un objeto con las DOS fuentes: `periodos` (BD, la fuente de
    // verdad) y `files` (Drive, para los años que faltan). Antes solo venía
    // `files`, y por eso el "historial" era un listado de archivos.
    if (event.data.files || event.data.periodos) {
                    _driveFilesCache = event.data.files || [];
                    renderYearCards(event.data);
                } else if (event.data.action === 'duplicateBudgetFile') {
                    handleDuplicateResponse(event.data);
                } else if (event.data.type === 'bd-import-result') {
                    // 📦824 — Volvió un import (nuevo período o reimportación).
                    handleImportResponse(event.data);
                } else if (event.data.error) {
                    showNotification(event.data.error, 'error');
                    hideLoading();
                }
            });

            // Navegación
            document.getElementById('backToSubmodulesBtn').addEventListener('click', () => {
                window.parent.postMessage({ action: 'backToHome' }, '*');
            });

            // Acciones de Archivo
            document.getElementById('openFileBtn')?.addEventListener('click', () => {
                const selectedFile = window.parent.selectedFile;
                if (selectedFile) {
                    window.parent.postMessage({ action: 'openBudgetFile', file: selectedFile }, '*');
                }
            });

            document.getElementById('duplicateFileBtn')?.addEventListener('click', async () => {
                const selectedFile = window.parent.selectedFile;
                if (selectedFile) {
                    const yearMatch = selectedFile.name.match(/(20\d{2})/);
                    const currentYear = yearMatch ? parseInt(yearMatch[1]) : new Date().getFullYear();
                    const nextYear = currentYear + 1;

                    // 📦708 (Fase 3.5) — Modernizado: usa KairConfirm (estilo 6.1.2)
                    const confirmed = await _confirmDialog().confirm({
                        title: '📋 ¿Clonar presupuesto?',
                        message: 'Vas a clonar el presupuesto "' + selectedFile.name + '" para el año ' + nextYear + '.',
                        details: 'Se mantendrán las partidas pero se reiniciarán los valores ejecutados.',
                        confirmText: 'Sí, clonar',
                        cancelText: 'Cancelar',
                        type: 'info'
                    });
                    if (confirmed) {
                        window.parent.postMessage({
                            action: 'duplicate-budget-file',
                            currentFilePath: selectedFile.path,
                            newYear: nextYear
                        }, '*');
                        showLoading();
                    }
                }
            });

            // Cargar datos iniciales
            window.parent.postMessage({ action: 'requestBudgetFiles' }, '*');
            showLoading();
        });

        /**
         * 📦824 — El historial es de la BD, no de los archivos.
         *
         * Antes agrupaba los .xlsx de Drive por año y decía "N versión(es)", que
         * respondía "¿hay un archivo?" y no "¿tengo el presupuesto de ese año?".
         * Ahora la lista principal son los PERÍODOS CARGADOS en la BD, con su
         * total y su % de ejecución, y los años que solo existen en Drive
         * aparecen aparte, marcados como importables.
         *
         * Al hacer clic en un período de BD se abre DIRECTO (sin pasar por el
         * Excel). Al hacer clic en uno de Drive se ofrece importarlo.
         */
        function renderYearCards(data) {
            hideLoading();
            const container = document.getElementById('yearOptions');
            container.innerHTML = '';

            const periodos = (data && data.periodos) || [];
            const files = (data && data.files) || [];
            const errorArchivos = data && data.errorArchivos;

            if (!periodos.length && !files.length) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-folder-open"></i>
                        <p>No hay presupuestos cargados ni archivos en Drive.</p>
                        <p style="font-size: 0.85em; opacity: 0.75;">Verifica que Google Drive esté montado (G:) y que la carpeta 1.1.3 Asignación de Recursos tenga el archivo del año.</p>
                    </div>
                `;
                return;
            }

            // ── Años que YA están en la BD ──────────────────────────────
            if (periodos.length) {
                container.appendChild(buildSeccion({
                    chip: 'fa-database', chipMod: '',
                    titulo: 'Períodos en la base de datos',
                    sub: 'Datos ya cargados. Ábralos para editar o reimporte desde Drive.',
                    count: periodos.length + ' ' + (periodos.length === 1 ? 'cargado' : 'cargados'),
                    countMod: '--bd'
                }));
                // 📦824-modern — Las cards viven dentro de su propio marco (`.sel-bd`),
                // igual que los tiles de Drive (`.sel-drive`). Antes iban sueltas
                // sobre el canvas, que rompía la simetría: un bloque con recuadro y
                // otro sin él. El marco es el MISMO para los dos (reglas agrupadas en
                // el CSS) y no toca la card por dentro.
                const panel = document.createElement('div');
                panel.className = 'sel-bd kair-block__panel';
                const grid = document.createElement('div');
                grid.className = 'sel-bd__grid kair-block__grid';
                periodos.sort((a, b) => b.anio - a.anio).forEach(p => {
                    grid.appendChild(buildPeriodoCard(p));
                });
                panel.appendChild(grid);
                container.appendChild(panel);
            }

            // ── Años que solo existen en Drive (aún no importados) ──────
            const aniosBd = new Set(periodos.map(p => Number(p.anio)));
            const porAnio = {};
            files.forEach(f => {
                const m = String(f.name || '').match(/(20\d{2})/);
                const y = m ? m[1] : 'General';
                (porAnio[y] = porAnio[y] || []).push(f);
            });

            const aniosPendientes = Object.keys(porAnio)
                .filter(y => y !== 'General' && !aniosBd.has(Number(y)))
                .sort((a, b) => b.localeCompare(a));

            if (aniosPendientes.length) {
                // 📦824-modern — Un solo panel con tiles, en vez de una card
                // por año. Antes eran 6 cards idénticas con el mismo ícono de
                // Excel que ocupaban una fila entera y no aportaban jerarquía.
                container.appendChild(buildSeccion({
                    chip: 'fa-file-excel', chipMod: 'sel-section__chip--drive',
                    titulo: 'En Drive, sin importar',
                    sub: 'Estos años existen en Drive pero todavía no están en la app.',
                    count: aniosPendientes.length + ' ' + (aniosPendientes.length === 1 ? 'disponible' : 'disponibles'),
                    countMod: ''
                }));
                const panel = document.createElement('div');
                panel.className = 'sel-drive kair-block__panel';
                const grid = document.createElement('div');
                grid.className = 'sel-drive__grid kair-block__grid';
                aniosPendientes.forEach(year => grid.appendChild(buildPendienteTile(year, porAnio[year])));
                panel.appendChild(grid);
                container.appendChild(panel);
            }

            if (errorArchivos) {
                container.appendChild(buildSeccion({
                    chip: 'fa-triangle-exclamation', chipMod: 'sel-section__chip--warn',
                    titulo: 'No se pudieron leer los archivos de Drive',
                    sub: _esc(errorArchivos),
                    count: 'revisar', countMod: '--warn'
                }));
            }
        }

        /** Encabezado de sección premium v2: chip + título + contador.
            📦824-wide — chip/texto/título/bajada son las clases compartidas
            `.kair-block__*` (las mismas del home); lo propio del selector es
            solo el contador de la derecha y los modificadores de color. */
        function buildSeccion(o) {
            const el = document.createElement('div');
            el.className = 'sel-section kair-block__head';
            el.innerHTML = `
                <div class="kair-block__chip ${o.chipMod || ''}"><i class="fas ${o.chip}"></i></div>
                <div class="kair-block__text">
                    <div class="kair-block__title">${_esc(o.titulo)}</div>
                    <div class="kair-block__sub">${o.sub || ''}</div>
                </div>
                <span class="sel-section__count ${o.countMod || ''}">${_esc(o.count || '')}</span>
            `;
            return el;
        }

        function _esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function _fmt(n) {
            const v = Number(n) || 0;
            return v.toLocaleString('es-CO', { maximumFractionDigits: 0 });
        }

        /** Card de un período YA cargado en BD: abrir = directo, sin Excel. */
        function buildPeriodoCard(p) {
            const card = document.createElement('div');
            card.className = 'year-card year-card--bd';
            const pct = Number(p.porcentaje) || 0;
            const nivel = pct > 100 ? 'over' : pct > 90 ? 'warn' : 'ok';
            const colorPct = nivel === 'over' ? '#d0453c' : nivel === 'warn' ? '#b07c1a' : '#1bb888';
            const avisos = Array.isArray(p.avisos) ? p.avisos.length : 0;
            const anchoBarra = Math.max(0, Math.min(100, pct));

            card.innerHTML = `
                <div class="pdb__head">
                    <div class="pdb__year">${p.anio}</div>
                    <span class="pdb__pill">Cargado</span>
                </div>

                <div class="pdb__body">
                    <div class="pdb__figs">
                        <div class="pdb__fig">
                            <div class="pdb__fig-label">Asignado</div>
                            <div class="pdb__fig-value">$${_fmt(p.totalAsignado)}</div>
                        </div>
                        <div class="pdb__fig">
                            <div class="pdb__fig-label">Ejecutado</div>
                            <div class="pdb__fig-value">$${_fmt(p.totalEjecutado)}</div>
                        </div>
                    </div>

                    <div class="pdb__side">
                        <div class="pdb__exec">
                            <div class="pdb__exec-head">
                                <span class="pdb__exec-label">Ejecución</span>
                                <span class="pdb__exec-value" style="color:${colorPct}">${pct.toFixed(0)}%</span>
                            </div>
                            <div class="pdb__bar"><div class="pdb__bar-fill pdb__bar-fill--${nivel}" style="width:${anchoBarra}%"></div></div>
                        </div>

                        <div class="pdb__chips">
                            ${p.ipc ? `<span class="pdb__chip"><i class="fas fa-arrow-trend-up"></i> IPC ${(p.ipc * 100).toFixed(1).replace('.', ',')}%</span>` : ''}
                            ${avisos ? `<span class="pdb__chip pdb__chip--warn" title="${_esc((p.avisos || []).join(' · '))}"><i class="fas fa-triangle-exclamation"></i> ${avisos} aviso(s)</span>` : ''}
                        </div>

                        <div class="pdb__actions">
                            <button class="pdb__btn pdb__btn--primary" data-accion="abrir">
                                <i class="fas fa-table"></i> Abrir
                            </button>
                            <button class="pdb__btn pdb__btn--icon" data-accion="actualizar" title="Reimportar el Excel de este año (reemplaza los datos)">
                                <i class="fas fa-rotate"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            card.querySelector('[data-accion="abrir"]').onclick = () => {
                window.parent.postMessage({
                    action: 'open-budget-from-db',
                    presupuestoId: p.id,
                    anio: p.anio
                }, '*');
            };

            card.querySelector('[data-accion="actualizar"]').onclick = async () => {
                const archivo = buscarArchivoDelAnio(p.anio);
                if (!archivo) {
                    await _confirmDialog().confirm({
                        title: 'No se encontró el archivo',
                        message: 'No hay un .xlsx de ' + p.anio + ' en la carpeta de Drive.',
                        details: 'El presupuesto actual se conserva. Si quieres reemplazarlo, primero deja el archivo en Drive.',
                        confirmText: 'Entendido',
                        type: 'warning'
                    });
                    return;
                }
                const ok = await _confirmDialog().confirm({
                    title: '¿Reimportar ' + p.anio + '?',
                    message: 'Se reemplaza el presupuesto de ' + p.anio + ' con el contenido del Excel.',
                    details: 'Esto NO toca los demás años. Lo que se cambie en la app para ' + p.anio + ' se pierde.',
                    confirmText: 'Sí, reimportar',
                    cancelText: 'Cancelar',
                    type: 'warning'
                });
                if (!ok) return;
                showLoading();
                window.parent.postMessage({
                    action: 'import-budget-to-db',
                    file: archivo,
                    anio: p.anio,
                    overwrite: true
                }, '*');
            };

            return card;
        }

        /**
         * 📦824-modern — Tile compacto de un año que está en Drive pero NO en la
         * BD. Reemplaza la card completa: la información real es solo "el año y
         * el archivo", y 6 cards con el mismo ícono ocupaban una fila entera.
         */
        function buildPendienteTile(year, files) {
            const tile = document.createElement('div');
            tile.className = 'sel-tile';
            const f = files[0];
            tile.innerHTML = `
                <div class="sel-tile__icon"><i class="fas fa-file-excel"></i></div>
                <div class="sel-tile__text">
                    <div class="sel-tile__year">${year}</div>
                    <div class="sel-tile__file">${_esc(f.name || '')}</div>
                </div>
                <button class="sel-tile__btn" data-accion="importar" title="Importar ${year} a la base de datos">
                    <i class="fas fa-download"></i>
                </button>
            `;
            tile.querySelector('[data-accion="importar"]').onclick = async () => {
                const ok = await _confirmDialog().confirm({
                    title: '¿Importar ' + year + ' a la base de datos?',
                    message: 'Se crea el período ' + year + ' con los datos del Excel.',
                    details: 'No se toca ningún otro año. Si el Excel tiene descuadres, la app te los avisa.',
                    confirmText: 'Sí, importar',
                    cancelText: 'Cancelar',
                    type: 'info'
                });
                if (!ok) return;
                showLoading();
                window.parent.postMessage({
                    action: 'import-budget-to-db',
                    file: f,
                    anio: Number(year),
                    overwrite: false
                }, '*');
            };
            return tile;
        }

        /** Busca el .xlsx de un año en la lista de Drive. */
        function buscarArchivoDelAnio(anio) {
            if (typeof _driveFilesCache === 'undefined') return null;
            const anioStr = String(anio);
            return _driveFilesCache.find(f => String(f.name || '').match(/(20\d{2})/) &&
                String(f.name).match(/(20\d{2})/)[1] === anioStr) || null;
        }

        function selectYear(year, files) {
            // Visual feedback
            document.querySelectorAll('.year-card').forEach(c => c.classList.remove('selected'));
            const cards = document.querySelectorAll('.year-card');
            for(let c of cards) { if(c.innerText.includes(year)) c.classList.add('selected'); }

            // Logic: Pick latest file
            const sortedFiles = files.sort((a, b) => new Date(b.modified) - new Date(a.modified));
            const latestFile = sortedFiles[0];
            window.parent.selectedFile = latestFile; // Global state for parent access

            // Update & Show Context Panel
            const detailsDiv = document.getElementById('fileDetails');
            document.getElementById('fileName').textContent = latestFile.name;
            document.getElementById('filePath').textContent = latestFile.path;
            
            detailsDiv.style.display = 'flex';
            // Simple animation reset
            detailsDiv.style.animation = 'none';
            detailsDiv.offsetHeight; /* trigger reflow */
            detailsDiv.style.animation = 'slideUp 0.3s ease-out';
        }

        function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        function handleDuplicateResponse(data) {
            hideLoading();
            showNotification(data.success ? (data.message || 'Clonado exitoso') : (data.error || 'Error al clonar'), data.success ? 'success' : 'error');
            if (data.success) window.parent.postMessage({ action: 'requestBudgetFiles' }, '*');
        }

        function showNotification(msg, type = 'success') {
            const el = document.getElementById('notification');
            el.querySelector('.toast-msg').textContent = msg;
            el.className = `k-toast ${type} show`;
            setTimeout(() => el.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
