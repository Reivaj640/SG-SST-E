<link rel="stylesheet" href="./modules/recursos/capacitaciones/capacitaciones-view.css">

<div class="k-app-layout">

<!-- 1. HEADER DEL MÓDULO (Header System v2.0 — Patrón 3: breadcrumb + tabs + acción ghost) -->
<header class="kair-header">
  <div class="kair-header__bar">
    <div class="kair-header__left">
      <button class="kair-header__back" id="btn-back-module" title="Volver al módulo Recursos">
        <i class="bi bi-arrow-left"></i>
      </button>
    </div>
    <div class="kair-header__divider"></div>
    <div class="kair-header__center">
      <h1 class="kair-header__title">
        <i class="bi bi-mortarboard-fill"></i> Programa de Capacitación
      </h1>
      <ol class="kair-header__breadcrumb">
        <li><a href="#" onclick="return false;">Recursos</a></li>
        <li class="kair-header__breadcrumb--active">1.2.1 Capacitaciones</li>
      </ol>
    </div>
    <div class="kair-header__right">
      <span class="kair-header__company">
        <i class="bi bi-building"></i>
        <span id="header-company-text">—</span>
      </span>
      <div class="kair-header__divider"></div>
      <button class="kair-header__action--secondary" id="btn-create-period-header" title="Crear periodo para el año siguiente">
        <i class="bi bi-calendar-plus"></i> Crear Periodo
      </button>
      <button class="kair-header__action--ghost" id="btn-export-excel" title="Exportar cronograma">
        <i class="bi bi-download"></i> Exportar
      </button>
    </div>
 </div>

 <!-- ======================== -->
 <!-- MODAL DE CONFIRMACIÓN K+AIR -->
 <!-- ======================== -->
 <div class="k-modal-overlay" id="confirmModal">
  <div class="k-modal k-modal-sm">

   <div class="k-modal-header">
    <h3 class="k-modal-title" id="confirm-title">
     <i class="bi bi-question-circle" id="confirm-icon"></i>
     Confirmar acción
    </h3>
    <button type="button" class="btn-close-modal" aria-label="Cerrar">
     <i class="bi bi-x-lg"></i>
    </button>
   </div>

   <div class="k-modal-body">
    <p id="confirm-message"></p>
    <p class="k-modal-warning" id="confirm-warning" style="display:none;"></p>
   </div>

   <div class="k-modal-footer">
    <button type="button" class="k-btn k-btn-outline" id="btn-confirm-cancel">Cancelar</button>
    <button type="button" class="k-btn k-btn-danger" id="btn-confirm-accept">
     <i class="bi bi-exclamation-triangle"></i>
     <span id="confirm-accept-label">Aceptar</span>
    </button>
   </div>

  </div>
 </div>
  <div class="kair-header__tabs">
    <button class="kair-header__tab active" data-view="dashboard">
      <i class="bi bi-speedometer2"></i> Dashboard
    </button>
    <button class="kair-header__tab" data-view="trainings">
      <i class="bi bi-list-task"></i> Listado Capacitaciones
      <span class="kair-header__tab-badge" id="badge-trainings" style="display:none;">0</span>
    </button>

  </div>
</header>

    <!-- 3. CONTENIDO PRINCIPAL -->
    <main class="k-main-content">

  <!-- VISTA: DASHBOARD -->
  <section id="view-dashboard" class="k-view-section active">

  <!-- Franja de estadísticas compacta -->
  <div class="k-stats-ribbon">
    <div class="k-stats-ribbon__item">
      <span class="k-stats-ribbon__icon primary"><i class="bi bi-calendar-check"></i></span>
      <div class="k-stats-ribbon__data">
        <span class="k-stats-ribbon__value" id="stat-total">0</span>
        <span class="k-stats-ribbon__label">Programadas</span>
      </div>
      <span class="k-stats-ribbon__pct" id="stat-progress-text">0%</span>
    </div>
    <div class="k-stats-ribbon__divider"></div>
    <div class="k-stats-ribbon__item">
      <span class="k-stats-ribbon__icon success"><i class="bi bi-check-circle"></i></span>
      <div class="k-stats-ribbon__data">
        <span class="k-stats-ribbon__value" id="stat-completed">0</span>
        <span class="k-stats-ribbon__label">Realizadas</span>
      </div>
    </div>
    <div class="k-stats-ribbon__divider"></div>
    <div class="k-stats-ribbon__item">
      <span class="k-stats-ribbon__icon warning"><i class="bi bi-clock-history"></i></span>
      <div class="k-stats-ribbon__data">
        <span class="k-stats-ribbon__value" id="stat-pending">0</span>
        <span class="k-stats-ribbon__label">Pendientes</span>
      </div>
    </div>
    <div class="k-stats-ribbon__divider"></div>
    <div class="k-stats-ribbon__item">
      <span class="k-stats-ribbon__icon muted"><i class="bi bi-people"></i></span>
      <div class="k-stats-ribbon__data">
        <span class="k-stats-ribbon__value k-stats-ribbon__value--muted" id="stat-participants">N/D</span>
        <span class="k-stats-ribbon__label">Asistencia</span>
      </div>
    </div>
  </div>

  <!-- Gráficas -->
  <div class="k-charts-grid">
    <div class="k-chart-container">
      <div class="k-chart-header">
        <div class="k-chart-title">Actividades SST vs PYP</div>
      </div>
      <div class="k-chart-body k-chart-body--donut">
        <canvas id="typeChart"></canvas>
      </div>
    </div>
    <div class="k-chart-container">
      <div class="k-chart-header">
        <div class="k-chart-title">Ejecución Mensual</div>
      </div>
      <div class="k-chart-body">
        <canvas id="trainingChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Próximas Capacitaciones -->
  <div class="k-chart-container k-recent-list-container">
    <div class="k-chart-title" style="margin-bottom: 1rem;">Próximas Capacitaciones</div>
    <div id="recent-list"></div>
  </div>

  </section>

        <!-- VISTA: LISTADO -->
        <section id="view-trainings" class="k-view-section">

            <div class="k-toolbar">
                <div class="k-filter-group">
                    <select id="yearFilter" class="k-form-select">
                        <option value="">Cargando años...</option>
                    </select>
                    <select id="typeFilter" class="k-form-select">
                        <option value="">Todos los Tipos</option>
                        <option value="sst">Seguridad (SST)</option>
                        <option value="pyp">Medicina Preventiva (PYP)</option>
                    </select>
                    <select id="statusFilter" class="k-form-select">
                        <option value="">Todos los Estados</option>
                        <option value="completed">Completada</option>
                        <option value="pending">Pendiente</option>
                    </select>
                    <select id="monthFilter" class="k-form-select">
                        <option value="">Todos los Meses</option>
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button class="k-btn k-btn-outline" id="btn-clear-filters">
                        <i class="bi bi-arrow-clockwise"></i> Limpiar
                    </button>
                    <button class="k-btn k-btn-primary" id="btn-add-training">
                        <i class="bi bi-plus-lg"></i> Agregar
                    </button>
                </div>
            </div>

            <div class="k-table-container">
                <table class="k-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th style="min-width:130px">Fecha</th>
                            <th>Instructor</th>
                            <th>Duración</th>
                            <th>Estado</th>
                            <th class="text-right" style="min-width:120px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="trainings-table-body"></tbody>
                </table>
            </div>
        </section>



    </main>
</div>

<!-- ======================== -->
<!-- MODAL UNIFICADO: AGREGAR / EDITAR CAPACITACIÓN -->
<!-- ======================== -->
<div class="k-modal-overlay" id="trainingModal">
    <div class="k-modal">

        <div class="k-modal-header">
            <h3 class="k-modal-title" id="modal-title">
                <i class="bi bi-plus-circle" id="modal-icon"></i>
                Nueva Capacitación
            </h3>
            <button type="button" class="btn-close-modal" aria-label="Cerrar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="k-modal-body">
            <form id="trainingForm" novalidate>
                <!-- ID oculto del registro en edición (vacío en modo crear) -->
                <input type="hidden" id="training-id" value="">

                <!-- Fila 1: Nombre y Tipo -->
                <div class="k-form-grid">
                    <div>
                        <label class="k-form-label" for="trainingName">Nombre *</label>
                        <input type="text" id="trainingName" class="k-form-control"
                               placeholder="Ej: Uso de EPP" required>
                    </div>
                    <div>
                        <label class="k-form-label" for="trainingType">Tipo *</label>
                        <select id="trainingType" class="k-form-control">
                            <option value="sst">Seguridad (SST)</option>
                            <option value="pyp">Medicina Preventiva (PYP)</option>
                        </select>
                    </div>
                </div>

                <!-- Fila 2: Fecha y Duración -->
                <div class="k-form-grid">
                    <div>
                        <label class="k-form-label" for="trainingDate">Fecha Programada *</label>
                        <input type="date" id="trainingDate" class="k-form-control" required>
                    </div>
                    <div>
                        <label class="k-form-label" for="trainingDuration">Duración (Horas)</label>
                        <input type="number" id="trainingDuration" class="k-form-control"
                               placeholder="2" value="2" min="1">
                    </div>
                </div>

                <!-- Fila 3: Instructor y Participantes -->
                <div class="k-form-grid">
                    <div>
                        <label class="k-form-label" for="trainingInstructor">Instructor</label>
                        <select id="trainingInstructor" class="k-form-control">
                            <option value="Técnico">Técnico Interno</option>
                            <option value="ARL">ARL</option>
                            <option value="Olga Pinto">ARL - Olga Pinto</option>
                        </select>
                    </div>
                    <div>
                        <label class="k-form-label" for="trainingParticipants">Participantes</label>
                        <input type="number" id="trainingParticipants" class="k-form-control"
                               placeholder="0" value="0" min="0">
                    </div>
                </div>
            </form>
        </div>

        <div class="k-modal-footer">
            <button type="button" class="k-btn k-btn-outline btn-close-modal">Cancelar</button>
            <button type="button" class="k-btn k-btn-primary" id="btn-save-training">
                <i class="bi bi-check-lg"></i> Guardar
            </button>
        </div>

    </div>
</div>
