<!-- modules/gestion-humana/contratacion/index.html
     📦756 · Vista "Contratación" — Cards EN PROCESO + COMPLETADOS
     Estructura:
       - 4 KPIs (Total Procesos, En Proceso, Completados, Ingresan Esta Semana)
       - Header de sección + botón "Nueva Contratación"
       - Sección "EN PROCESO" con grid de cards (2 columnas)
       - Sección "COMPLETADOS RECIENTEMENTE" con cards (1 columna)
     IDs con prefijo `ct-` para evitar colisiones. -->

<div class="ct-wrapper" id="ct-wrapper">
  <div class="ct-kpi-section">
    <div id="ct-kpi-bar" class="ct-kpi-bar"></div>
  </div>

  <div class="ct-section-head">
    <div class="ct-section-head__text">
      <h2 class="ct-section-head__title">Procesos de Contratación</h2>
      <p class="ct-section-head__sub">Workflow paso a paso desde recepción del memo hasta activación en S400</p>
    </div>
    <button id="ct-new-btn" class="ct-btn ct-btn--primary" type="button">
      <i class="fas fa-plus"></i> Nueva Contratación
    </button>
  </div>

  <div class="ct-block">
    <h3 class="ct-block__title">EN PROCESO</h3>
    <div id="ct-en-proceso" class="ct-cards-grid"></div>
  </div>

  <div class="ct-block">
    <h3 class="ct-block__title">CONTRATACIONES COMPLETADAS</h3>
    <div class="ct-completados-grid">
      <div class="ct-completados-periodo">
        <h4 class="ct-completados-periodo__title">Última semana <span class="ct-completados-count" id="ct-completados-semana-count">(0)</span></h4>
        <div id="ct-completados-semana" class="ct-cards-list"></div>
      </div>
      <div class="ct-completados-periodo">
        <h4 class="ct-completados-periodo__title">Último mes <span class="ct-completados-count" id="ct-completados-mes-count">(0)</span></h4>
        <div id="ct-completados-mes" class="ct-cards-list"></div>
      </div>
      <div class="ct-completados-periodo">
        <h4 class="ct-completados-periodo__title">Últimos 3 meses <span class="ct-completados-count" id="ct-completados-3meses-count">(0)</span></h4>
        <div id="ct-completados-3meses" class="ct-cards-list"></div>
      </div>
      <div class="ct-completados-periodo">
        <h4 class="ct-completados-periodo__title">Último semestre <span class="ct-completados-count" id="ct-completados-semestre-count">(0)</span></h4>
        <div id="ct-completados-semestre" class="ct-cards-list"></div>
      </div>
    </div>
  </div>

  <div class="ct-block">
    <h3 class="ct-block__title">RESUMEN DE COMPLETADOS</h3>
    <div class="ct-completados-stats" id="ct-completados-stats"></div>
  </div>
</div>
