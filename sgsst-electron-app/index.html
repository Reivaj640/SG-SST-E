<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net http://localhost:8080; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com http://localhost:3010 http://localhost:3011 http://localhost:8080 ws://localhost:3010 ws://localhost:3011 ws://localhost:8080; frame-src 'self' http://localhost:3010 http://localhost:3011 http://localhost:8080; child-src 'self' http://localhost:3010 http://localhost:3011 http://localhost:8080; worker-src 'self' blob:; ">
  <title>K+AIR</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="development-styles.css">
  <link rel="stylesheet" href="modules/gestion-integral/evaluacion-inicial-sg-sst/evaluacion-inicial-sg-sst.css">
  <link rel="stylesheet" href="modules/gestion-salud/investigacion-accidentes/investigacion-accidentes-view.css">
  <link rel="stylesheet" href="node_modules/vanilla-calendar-pro/styles/index.css">

  <!-- Scripts para animación de fondo (Vanta.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>

  <!-- Font Awesome (íconos dentro del círculo) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Cargar estilos externos necesarios -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <!-- Cargar fuentes específicas -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="header-content">
        <div class="logo-container">
          <img id="header-logo" src="" alt="Logo" style="display:none;">
          <div id="logo-placeholder" class="logo-placeholder" style="display:none;">IMG</div>
        </div>
        <h1 id="app-title" class="header-title-left">
          <img src="assets/KIAR256.ico" alt="App Icon"
     style="position: relative;
            vertical-align: middle;
            margin-right: 15px;
            height: 48px;
            width: 48px;
            object-fit: contain;
            top: 2px;
            transform: scale(1.6);
            transform-origin: left center;">
          <strong>K+AIR</strong> <small> Powered by GEST-IAR</small>
        </h1>
        <div class="header-buttons">
          <button id="calendar-button" class="header-btn" title="Calendario">
            <span id="calendar-icon-placeholder" class="icon-placeholder">📅</span>
          </button>
          <button id="config-button" class="header-btn" title="Configuraciones">
            <span id="config-icon-placeholder" class="icon-placeholder">⚙️</span>
          </button>
          <button id="llm-button" class="header-btn" title="Chat LLM">
            <span id="llm-icon-placeholder" class="icon-placeholder">💬</span>
          </button>
        </div>
      </div>
    </header>

    <div class="main-container">
      <aside id="sidebar">
        <div id="company-info" class="company-info">
          <img id="company-logo" src="" alt="Logo Empresa" style="display:none;">
          <div id="company-logo-placeholder" class="company-logo-placeholder">Logo</div>
          <span id="company-name">Empresa</span>
        </div>
        <nav>
          <ul id="sidebar-menu"></ul>
        </nav>
      </aside>

      <main id="main-content">
        <div id="content-area"></div>
      </main>
    </div>

    <footer id="app-footer">
      <div class="footer-content">
        <p>© 2025 Javier Robles F. Prof. SG-SST - Esp. Gerencia de Proyectos.</p>
        <span id="app-version" class="footer-version"></span>
      </div>
    </footer>
  </div>

  <!-- Custom Alert Modal -->
  <div id="custom-alert-overlay">
    <div id="custom-alert-modal">
      <p id="custom-alert-message"></p>
      <button id="custom-alert-close" class="btn">Aceptar</button>
    </div>
  </div>

  <!-- Cargar bibliotecas externas -->
  <script src="node_modules/jquery/dist/jquery.min.js"></script>
  <script src="node_modules/jquery-ui-dist/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="node_modules/jquery-ui-dist/jquery-ui.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="node_modules/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Inicializar sistema modular -->
  <script src="scripts/theme-manager.js"></script>
  <!-- Cargar los componentes -->
  <script src="modules/gestion-salud/reportes-accidentes/reportes-accidentes-logic.js"></script>
  <script src="modules/gestion-salud/restricciones-medicas/restricciones-medicas-logic.js"></script>
  <script src="modules/gestion-salud/evaluaciones-medicas/evaluaciones-medicas-logic.js"></script>
  <script src="modules/recursos/responsable-sg/responsable-sg-logic.js"></script>
  <script src="modules/recursos/capacitacion-copasst/capacitacion-copasst-logic.js"></script>
  <script src="modules/recursos/trabajo-alto-riesgo/trabajo-alto-riesgo-logic.js"></script>
  <script src="modules/recursos/roles-responsabilidades/roles-responsabilidades-logic.js"></script>
  <script src="modules/recursos/afiliacion/afiliacion-logic.js"></script>
  <script src="modules/recursos/curso-virtual/curso-virtual-logic.js"></script>
  <script src="modules/gestion-integral/politica/politica-logic.js"></script>
  <script src="modules/gestion-integral/objetivos-sst/objetivos-sst-logic.js"></script>
  <script src="modules/gestion-integral/evaluacion-inicial-sg-sst/evaluacion-inicial-sg-sst.js"></script>
  <script src="modules/gestion-salud/sociodemografica/sociodemografica-component.js"></script>
  <script src="modules/gestion-integral/gestion-integral-home.js"></script>
  <script src="modules/recursos/recursos-home.js"></script>
  <script src="modules/gestion-salud/gestion-salud-home.js"></script>
  <script src="modules/gestion-peligros/gestion-peligros-home.js"></script>
  <script src="modules/gestion-amenazas/gestion-amenazas-home.js"></script>
  <script src="modules/verificacion/verificacion-home.js"></script>
  <script src="modules/mejoramiento/mejoramiento-home.js"></script>
  <script src="modules/gestion-salud/investigacion-accidentes/investigacion-accidentes-logic.js"></script>
  <script src="modules/recursos/copasst/copasst-logic.js"></script>
  <script src="modules/recursos/comite-convivencia/comite-convivencia-logic.js"></script>
  <script src="modules/gestion-salud/ausentismo/medicion-ausentismo.js"></script>
  <script src="modules/gestion-salud/ausentismo/medicion-ausentismo-home.js"></script>
  <script src="modules/gestion-salud/ausentismo/registrar-ausentismo.js"></script>
  <script src="modules/recursos/presupuesto/presupuesto-logic.js"></script>
  <script src="modules/recursos/capacitaciones/capacitaciones-logic.js"></script>
  <script src="modules/recursos/capacitaciones/capacitaciones-viewer.js"></script>
  <script src="modules/recursos/inducciones/inducciones-logic.js"></script>
  <script src="modules/recursos/inducciones/inducciones-viewer.js"></script>
  <script src="node_modules/vanilla-calendar-pro/index.js"></script>
  <script src="modules/gestion-integral/plan-trabajo/plan-trabajo-logic.js"></script>
  <script src="modules/gestion-integral/rendicion-cuentas/rendicion-logic.js"></script>
  <script src="modules/gestion-integral/rendicion-cuentas/rendicion-viewer.js"></script>
  
  <!-- Sistema de Notificaciones Moderno para Actualizaciones -->
  <script src="assets/js/update-notifications.js"></script>
  
  <script src="renderer.js"></script>
  
  <!-- Contenedor de Notificaciones (Toast Hub) -->
  <div id="notification-hub"></div>
</body>
</html>
