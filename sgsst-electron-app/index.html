<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'self'; child-src 'self';">
  <title>SG-SST Electron App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="development-styles.css">
  <link rel="stylesheet" href="investigacion-accidente.css">
  <link rel="stylesheet" href="node_modules/vanilla-calendar-pro/styles/index.css">

  <!-- Scripts para animación de fondo (Vanta.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>

  <!-- Cargar estilos externos necesarios -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="header-content">
        <div class="logo-container">
          <img id="header-logo" src="" alt="Logo" style="display:none;">
          <div id="logo-placeholder" class="logo-placeholder" style="display:none;">IMG</div>
        </div>
        <h1 id="app-title" class="header-title-left"><img src="assets/icons8-adelante-100.ico" alt="App Icon" style="vertical-align: middle; margin-right: 10px; height: 32px;">Sistema de Gestión de Seguridad y Salud en el Trabajo</h1>
        <div class="header-buttons">
          <button id="calendar-button" class="header-btn" title="Calendario">
            <span id="calendar-icon-placeholder" class="icon-placeholder">📅</span>
          </button>
          <button id="config-button" class="header-btn" title="Configuraciones">
            <span id="config-icon-placeholder" class="icon-placeholder">⚙️</span>
          </button>
          <button id="llm-button" class="header-btn" title="Chat LLM">
            <span id="llm-icon-placeholder" class="icon-placeholder">💬</span>
          </button>
        </div>
      </div>
    </header>

    <div class="main-container">
      <aside id="sidebar">
        <div id="company-info" class="company-info">
          <img id="company-logo" src="" alt="Logo Empresa" style="display:none;">
          <div id="company-logo-placeholder" class="company-logo-placeholder">Logo</div>
          <span id="company-name">Empresa</span>
        </div>
        <nav>
          <ul id="sidebar-menu"></ul>
        </nav>
      </aside>

      <main id="main-content">
        <div id="content-area"></div>
      </main>
    </div>

    <footer id="app-footer">
      <div class="footer-content">
        <p>© 2025 Javier Robles F. Prof. SG-SST - Esp. Gerencia de Proyectos.</p>
        <span id="app-version" class="footer-version"></span>
      </div>
    </footer>
  </div>

  <!-- Custom Alert Modal -->
  <div id="custom-alert-overlay">
    <div id="custom-alert-modal">
      <p id="custom-alert-message"></p>
      <button id="custom-alert-close" class="btn">Aceptar</button>
    </div>
  </div>

  <!-- Cargar bibliotecas externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="node_modules/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Inicializar sistema modular -->
  <script src="init-modular-system.js"></script>
  <!-- Cargar los componentes -->
  <script src="reportes-accidentes.js"></script>
  <script src="restricciones-medicas.js"></script>
  <script src="evaluaciones-medicas.js"></script>
  <script src="modules/recursos/responsable-sg/responsable-sg-logic.js"></script>
  <script src="modules/recursos/capacitacion-copasst/capacitacion-copasst-logic.js"></script>
  <script src="modules/recursos/trabajo-alto-riesgo/trabajo-alto-riesgo-logic.js"></script>
  <script src="modules/recursos/roles-responsabilidades/roles-responsabilidades-logic.js"></script>
  <script src="modules/recursos/afiliacion/afiliacion-logic.js"></script>
  <script src="modules/recursos/curso-virtual/curso-virtual-logic.js"></script>
  <script src="modules/gestion-integral/politica/politica-logic.js"></script>
  <script src="sociodemografica-component.js"></script>
  <script src="gestion-integral-home.js"></script>
  <script src="recursos-home.js"></script>
  <script src="gestion-salud-home.js"></script>
  <script src="gestion-peligros-home.js"></script>
  <script src="gestion-amenazas-home.js"></script>
  <script src="verificacion-home.js"></script>
  <script src="mejoramiento-home.js"></script>
  <script src="investigacion-accidentes.js"></script>
  <script src="investigacion-accidente.js"></script>
  <script src="modules/recursos/copasst/copasst-logic.js"></script>
  <script src="modules/recursos/comite-convivencia/comite-convivencia-logic.js"></script>
  <script src="curso-50-horas.js"></script>
  <script src="medicion-ausentismo.js"></script>
  <script src="registrar-ausentismo.js"></script>
  <script src="modules/recursos/presupuesto/presupuesto-logic.js"></script>
  <script src="components/capacitaciones/capacitaciones.js"></script>
  <script src="components/capacitaciones/capacitaciones-viewer.js"></script>
  <script src="components/inducciones/inducciones.js"></script>
  <script src="components/inducciones/inducciones-viewer.js"></script>
  <script src="node_modules/vanilla-calendar-pro/index.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
